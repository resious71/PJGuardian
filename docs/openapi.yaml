          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: export_busy(동시 실행 — details.scope = user | server)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: export_timeout(시간 상한) · export_failed(메모리 상한 등 — 쓰던 임시 파일은 지움)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/rules:
    get:
      summary: 규칙 목록(검색·필터·정렬·쪽). 설명 본문은 넣지 않는다(요약만)
      description: |
        q: 규칙 키·이름·요약·설명 검색(대소문자 무시, 부분 일치 — 3글자 이상은 FTS5 trigram, 그 미만은 키·이름·요약 LIKE). 최대 100자.
        language(python|javascript, X08 화면의 언어 탭 — python = tool ruff, javascript = tool eslint. 표시 필터일 뿐 권한과 무관. tool과 함께 주면 같은 도구여야 하고 다르면 400 invalid_rule_filter(field = language)),
        tool(ruff|eslint), category, severity(쉼표 다중: critical,high,medium,low,not_defined), default_enabled(1|0), fixable(1|0), deprecated(1|0),
        change(new = 이번 활성 버전에서 신설·이름 변경, changed = 이번 버전에서 바뀜, unchanged), sort(rule|name|severity|tool), order(asc|desc).
        항목: tool, rule, key(결함 rule_key 형식), name, summary, category, origin, default_enabled, fixable(none|sometimes|always), status, severity, severity_level, change, href,
        P22B: analysis_enabled(분석 적용 — 관리자 변경 반영), overridden, enableable, enable_block(켤 수 없는 이유 코드 | null). 변경자·사유는 목록에 없다.
        P22B 조건: analysis(1|0 — 분석 적용), overridden(1 = 관리자가 바꾼 것만). default_enabled(1|0, 서버 기본값)도 그대로 받는다.
        P23: 항목에 version(기준 도구 버전)·docs_url(공식 문서 주소, 도구가 준 https만)을 더했다(내보내기 열과 같은 값).
        P22C 조건: prefix(규칙 키 접두사 — 키가 그 값으로 시작. 키에 쓰는 글자 [A-Za-z0-9@/_.-] 64자, ruff는 대문자·ESLint는 소문자로 맞춰 비교, 틀리면 400 field = prefix).
      operationId: listRules
      tags: [rules]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 규칙 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          description: invalid_rule_filter(details.field — language가 python|javascript 밖이거나 tool과 어긋나면 language), invalid_pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/rules/meta:
    get:
      summary: 기준 버전(도구별 활성 적재 버전·구성 요소·기준 버전 여부·적재 시각·적재된 버전 목록·카테고리·활성 버전의 총 규칙 수 rules — X08 탭 머리글), 활성 도구 버전과 다른지(stale), 마지막 적재 작업
      operationId: rulesMeta
      tags: [rules]
      responses:
        '200':
          description: 메타
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/rules/syntax-error:
    get:
      summary: 특수 키 syntax-error(문법 오류) 설명과 볼 수 있는 프로젝트의 열린 결함 수
      operationId: ruleSyntaxError
      tags: [rules]
      responses:
        '200':
          description: special = true
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/rules/{tool}/{rule}:
    get:
      summary: 규칙 상세 — 설명(마크다운 원문), 기본 심각도와 근거(P21S), 기본 활성, 자동 수정, 폐기·대체 규칙, 공식 문서 주소(도구가 준 https만), 정보 출처, 버전별 변경 내역, 열린 결함 수(볼 수 있는 프로젝트, 프로젝트별 결함 목록 주소)
      description: |
        rule은 /가 들어갈 수 있다(예: @typescript-eslint/no-unused-vars → /api/v1/rules/eslint/%40typescript-eslint/no-unused-vars).
        활성 버전에 없고 이전 적재 버전에만 있는 규칙은 200 + missing = true와 fate(renamed: to·version·href / removed: version)·마지막으로 알려진 정보.
        한 번도 적재된 적 없는 키는 404 rule_not_found. eslint:unused-disable-directive·eslint:no-rule-id는 PJGuardian 특수 키(special = true).
        P22B: analysis = {enabled(분석 적용), base_enabled, overridden, enableable, block(켤 수 없는 이유 코드 | null), scope(all = 모든 ESLint 프로젝트 | server_default = 서버 기본 설정을 쓰는 ruff 프로젝트만),
        revision, override(admin에게만 {reason, changed_at, changed_by_name, tool_version}, 그 밖에는 null)}. 활성 버전에 없는 규칙이면 analysis = null.
      operationId: getRule
      tags: [rules]
      parameters:
        - name: tool
          in: path
          required: true
          schema:
            type: string
            enum: [ruff, eslint]
        - name: rule
          in: path
          required: true
          schema:
            type: string
            maxLength: 190
      responses:
        '200':
          description: 규칙 상세
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: rule_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/rules/reload:
    post:
      summary: 규칙 데이터 다시 불러오기 요청(admin) — 관리 작업 rules_load(워커가 처리, 대기·실행 중이면 합침 merged). 감사 rules.reload_request
      operationId: reloadRules
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: '요청됨({task, merged})'
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  # ---- 관리자 규칙 켜기·끄기(P22B, admin 전용, 016) ----
  /api/v1/admin/rules/{tool}/{rule}/override:
    parameters:
      - name: tool
        in: path
        required: true
        schema: { type: string, enum: [ruff, eslint] }
      - name: rule
        in: path
        required: true
        description: 규칙 키(P22 표기, 도구 접두사 없음). /와 @가 들어갈 수 있다(@typescript-eslint/no-unused-vars → %40typescript-eslint/no-unused-vars). 활성 버전 규칙 목록에 있는 값만
        schema: { type: string, maxLength: 190 }
    put:
      summary: 규칙 켜기·끄기(서버 전체, 다음 분석부터). 기본값과 같아지면 변경 행을 지운다. 감사 rules.override_set
      description: |
        본문 {enabled: bool, expected_enabled: bool(지금 실효값 — 낙관적 동시성), reason?: string(200자 이하)}.
        적용 범위: ESLint는 모든 프로젝트, ruff는 서버 기본 설정을 쓰는 프로젝트만(프로젝트가 올린 ruff 설정은 그대로).
        켤 수 없는 규칙은 422 rule_not_enableable(details.reason: removed | deprecated | preview | requires_type_info | requires_options | special_key). 끄기는 언제나 된다.
        응답: 새 상태 {tool, rule, version, base_enabled, enabled, overridden, enableable, block, revision, override{reason, changed_at, changed_by, changed_by_name, base_enabled, tool_version}}.
      operationId: setRuleOverride
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, expected_enabled]
              properties:
                enabled: { type: boolean }
                expected_enabled: { type: boolean }
                reason: { type: string, maxLength: 200, nullable: true }
      responses:
        '200':
          description: 새 상태
        '400':
          description: invalid_input(details.field), invalid_json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: rule_not_found(활성 버전에 없는 규칙·알 수 없는 키)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: rule_override_conflict(expected_enabled가 지금 실효값과 다름 — details.current = 지금 상태)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: rule_not_enableable(details.reason)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: 기본값으로 되돌리기(멱등 — 변경이 없으면 cleared = false). 활성 버전에 없는 규칙의 변경도 지울 수 있다. 감사 rules.override_clear
      operationId: clearRuleOverride
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{tool, rule, cleared, revision}'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: rule_not_found(변경도 없고 적재된 적도 없는 키)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/rules/syntax-error/override:
    put:
      summary: 특수 키는 바꿀 수 없음 — 항상 422 rule_not_enableable(details.reason = special_key)
      operationId: setSpecialRuleOverride
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: rule_not_enableable(special_key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: 특수 키는 바꿀 수 없음 — 항상 422 rule_not_enableable(details.reason = special_key)
      operationId: clearSpecialRuleOverride
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: rule_not_enableable(special_key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/rules/overrides:
    get:
      summary: 관리자 규칙 변경 목록 + 요약(admin)
      description: |
        tool(ruff|eslint, 없으면 전체), state(active = 적용 중 | missing = 활성 버전에 없음 | not_enableable = 켤 수 없게 된 규칙).
        항목: tool, rule, key, name, enabled, base_enabled, reason, tool_version, changed_at, changed_by, changed_by_name, state, block, href.
        summary: 도구별 {count, enabled, disabled, last_changed_at, revision, config_hash(서버 기본 설정으로 분석할 때의 실효 설정 해시 앞 12자리 — .eslintignore·업로드 ruff 설정이 없는 프로젝트 기준),
        upload_config_projects(ruff: 마지막 성공 분석의 설정 출처가 upload인 Python 프로젝트 수 — 변경이 적용되지 않음)}, reset_max.
      operationId: listRuleOverrides
      tags: [admin]
      parameters:
        - name: tool
          in: query
          schema: { type: string, enum: [ruff, eslint] }
        - name: state
          in: query
          schema: { type: string, enum: [active, missing, not_enableable] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 목록(data, page, summary)
        '400':
          description: invalid_input(details.field = tool | state), invalid_pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/rules/overrides/bulk/preview:
    post:
      summary: 규칙 일괄 변경 미리보기(admin, 쓰지 않음, P22C)
      description: |
        응답: {tool, action, total(대상 수), max(rules.bulk_max), changes(실제로 바뀔 수), turn_on, turn_off, unchanged(이미 그 상태),
        skipped{removed, deprecated, preview, requires_type_info, requires_options, special_key, missing}, skipped_total, examples(10개: rule·key·name·from·to),
        open_defects(바뀔 규칙의 서버 전체 열린 결함 수), revision(지금 개정 번호 — 적용 때 expected_revision으로)}.
        켤 수 없는 규칙은 422가 아니라 건너뛰고 건수로 알린다. 대상이 rules.bulk_max를 넘으면 400 bulk_too_large(details.total·max, 잘라서 적용하지 않음).
      operationId: previewRuleOverridesBulk
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool, action, target]
              properties:
                tool: { type: string, enum: [ruff, eslint], description: 탭의 도구(대상은 이 도구 하나) }
                action: { type: string, enum: [enable, disable, reset] }
                target:
                  type: object
                  description: |
                    {mode: keys, keys: [규칙 키…]}(현재 쪽에서 고른 것, ui.page_size_max개까지 — 서버가 각 키를 활성 버전과 대조, 없는 키·다른 도구 키는 "활성 버전에 없음"으로 건너뜀, 글자가 틀리면 400)
                    또는 {mode: filter, filter: {GET /api/v1/rules와 같은 조건 — language·q·prefix·category·severity·analysis·overridden·…}}(서버가 같은 조건으로 다시 조회, 쪽·정렬은 무시)
                reason: { type: string, maxLength: 200, nullable: true }
      responses:
        '200':
          description: 미리보기
        '400':
          description: invalid_input(details.field = action·keys·target), invalid_rule_filter(조건 — 접두사 포함, 탭과 다른 도구), bulk_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: rule_not_found(알 수 없는 도구)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/rules/overrides/bulk:
    post:
      summary: 규칙 일괄 변경 적용(admin, P22C) — 한 트랜잭션, 개정 번호 한 번 +1(바뀐 것이 있을 때), 감사 rules.override_bulk(개별 rules.override_set는 남기지 않음)
      description: |
        본문은 미리보기와 같고 expected_revision(미리보기가 준 revision) 필수. 그 사이 개정 번호가 바뀌었으면 409 rule_override_conflict(details.reason = revision_changed, details.revision = 지금 값) — 아무것도 바꾸지 않는다.
        대상은 트랜잭션 안에서 서버가 다시 정한다. 응답은 미리보기와 같은 건수(open_defects 없음) + 적용 뒤 revision.
      operationId: applyRuleOverridesBulk
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool, action, target, expected_revision]
              properties:
                tool: { type: string, enum: [ruff, eslint], description: 탭의 도구(대상은 이 도구 하나) }
                action: { type: string, enum: [enable, disable, reset] }
                target:
                  type: object
                  description: |
                    {mode: keys, keys: [규칙 키…]}(현재 쪽에서 고른 것, ui.page_size_max개까지 — 서버가 각 키를 활성 버전과 대조, 없는 키·다른 도구 키는 "활성 버전에 없음"으로 건너뜀, 글자가 틀리면 400)
                    또는 {mode: filter, filter: {GET /api/v1/rules와 같은 조건 — language·q·prefix·category·severity·analysis·overridden·…}}(서버가 같은 조건으로 다시 조회, 쪽·정렬은 무시)
                reason: { type: string, maxLength: 200, nullable: true }
                expected_revision: { type: integer }
      responses:
        '200':
          description: 적용 결과
        '400':
          description: invalid_input(expected_revision·reason 등), invalid_rule_filter, bulk_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: rule_not_found(알 수 없는 도구)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: rule_override_conflict(details.reason = revision_changed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/rules/overrides/reset:
    post:
      summary: 도구별 모두 기본값으로 되돌리기(admin). 한 번에 rules.override_reset_max건까지 — 남으면 remaining > 0. 감사 rules.override_reset_all
      operationId: resetRuleOverrides
