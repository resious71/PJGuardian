              description: 그 분석 id(화면의 Run 링크 → /projects/{id}/history?analysis=<id>). 한정되면 Run N의 분석
            rule_missing:
              type: boolean
              description: 규칙이 활성 도구 버전에 없음(P22, 예전 버전의 결함). 규칙 데이터를 적재하기 전에는 false
            last_detected_detail_deleted:
              type: boolean
              description: 마지막 감지 Run의 상세가 삭제됨(P21B, 표시용 — 링크는 유지하고 툴팁으로 안내)
