        '404':
          $ref: '#/components/responses/GroupNotFound'
  /api/v1/groups/{id}/members:
    get:
      summary: 구성원 목록(admin 또는 이 그룹의 관리자). 로그인 ID 순
      operationId: listGroupMembers
