                      $ref: '#/components/schemas/GroupMember'
        '404':
          $ref: '#/components/responses/GroupNotFound'
    post:
      summary: 기존 사용자를 구성원으로 추가(admin 또는 이 그룹의 관리자)
      operationId: addGroupMember
