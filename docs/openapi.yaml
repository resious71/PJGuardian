              schema: { type: string, format: binary }
        '400':
          description: invalid_export_format, invalid_defect_filter(조건 — 목록 API와 같은 검증, 알 수 없는 키 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: export_empty(내보낼 항목 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: export_too_large(details.count·limit — 파일을 만들지 않음, 잘라서 주지 않음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: export_busy(동시 실행 — details.scope = user | server)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: export_timeout(시간 상한) · export_failed(메모리 상한 등 — 쓰던 임시 파일은 지움)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/rules/export:
