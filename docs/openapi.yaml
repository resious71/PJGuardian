            application/json:
              schema:
                $ref: '#/components/schemas/GroupData'
        '404':
          $ref: '#/components/responses/GroupNotFound'
    patch:
      summary: 그룹 이름·설명 수정(admin). 이름 변경은 감사 로그 group.rename
      operationId: updateGroup
      tags: [groups]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupData'
        '400':
          description: invalid_group_name, invalid_description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/GroupNotFound'
        '409':
          description: group_name_taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: 그룹 삭제(admin). 사용자 계정은 그대로, 소속(과 이후 단계의 프로젝트 매핑)만 사라진다
