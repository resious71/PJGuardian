openapi: 3.0.3
info:
  title: PJGuardian API
  version: 1.0.0
  description: |
    PJGuardian REST JSON API (명세 19.7).
    - 경로는 /api/v1/... 이고, 요청·응답 본문은 JSON(UTF-8)이다.
    - 성공 응답은 {"data": ...}, 목록은 {"data": [...], "page": {...}}, 오류는 {"error": {...}} 형식이다.
    - 모든 응답에 X-Request-Id 헤더가 붙는다. 오류를 문의할 때 이 값을 알려 준다.
    - 인증은 세션 쿠키(pjg_session, HttpOnly·Secure·SameSite=Lax)로 한다. 30분 동안 활동이 없으면 만료된다(명세 3).
    - 상태를 바꾸는 요청(POST/PUT/PATCH/DELETE)은 모두 X-CSRF-Token 헤더가 필요하다(로그인 포함, 예외 없음).
      로그인 전에는 GET /api/v1/auth/csrf로 토큰을 받고, 로그인 응답의 새 토큰으로 바꿔 쓴다. 없거나 틀리면 403 csrf_invalid.
    - 로그인이 필요한 API는 비로그인이면 401(unauthenticated, 만료면 session_expired), 권한이 없으면 403(forbidden).
      임시 비밀번호로 로그인한 상태에서는 auth/me·auth/password·auth/logout 외의 API가 403(password_change_required)이다.
    - 이 문서와 src/routes.php의 등록 라우트는 tests/Integration/OpenApiTest.php가 일치를 검사한다.
      라우트를 추가하면 같은 경로·메서드를 아래 paths에 반드시 넣는다(docs/architecture.md).
servers:
  - url: https://pjguardian.local
    description: 개발 PC (docs/xampp_vhost.md)

paths:
  /api/v1/meta/version:
    get:
      summary: 앱 이름과 버전
      operationId: getMetaVersion
      tags: [meta]
      responses:
        '200':
          description: 앱 정보
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [app, version]
                    properties:
                      app:
                        type: string
                        example: PJGuardian
                      version:
                        type: string
                        example: 0.1.0-dev

  /api/v1/auth/csrf:
    get:
      summary: CSRF 토큰 발급(세션이 없으면 로그인 전 세션을 만든다)
      operationId: getCsrfToken
      tags: [auth]
      responses:
        '200':
          description: 토큰. 세션을 새로 만들었으면 Set-Cookie가 붙는다
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      csrf_token:
                        type: string
                        pattern: '^[0-9a-f]{64}$'
  /api/v1/auth/login:
    post:
      summary: 로그인(성공하면 세션 ID와 CSRF 토큰을 새로 발급)
      description: |
        실패 응답은 계정 존재·잠금·비활성 여부를 구분하지 않는다(login_failed).
        5회 연속 실패하면 계정이 15분 잠기고, 같은 IP에서 10분 내 20회 실패하면 IP가 15분 차단된다(429).
      operationId: login
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_id, password]
              properties:
                login_id:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      csrf_token:
                        type: string
                      notice:
                        type: object
                        nullable: true
                        description: 관리자가 비밀번호를 바꾼 뒤 첫 로그인이면 한 번 담긴다(변경 강제 없음)
                        properties:
                          code:
                            type: string
                            enum: [password_set_by_admin]
                          at:
                            type: string
                            format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: login_failed 또는 temp_password_expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          description: too_many_attempts(IP 차단)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      summary: 로그아웃(서버에서 세션 폐기, 쿠키 삭제)
      operationId: logout
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 로그아웃됨
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/auth/me:
    get:
      summary: 현재 사용자(임시 비밀번호 상태에서도 허용)
      operationId: getMe
      tags: [auth]
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/password:
    post:
      summary: 본인 비밀번호 변경(임시 비밀번호 강제 변경 포함, 정책 적용)
      description: 성공하면 같은 사용자의 다른 세션은 모두 폐기되고 현재 세션은 유지된다.
      operationId: changeOwnPassword
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: current_password_incorrect, password_policy, password_reused, invalid_input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/users:
    get:
      summary: >-
        사용자 목록(관리자). P28B: 기본은 승인된 계정만, approval=pending|rejected는 외부 인증 첫 로그인의 승인 대기·거절 계정(행에 name_conflict —
        이름이 다른 사용자의 로그인 ID와 같음). 응답에 approval_counts {pending, rejected}와 auth_types(켜진 인증 방식)를 함께. 행에 approval_status·external_linked
      operationId: listUsers
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          description: 로그인 ID·표시 이름·이메일 부분 일치
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, user]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: approval
          in: query
          schema:
            type: string
            enum: [pending, rejected]
      responses:
        '200':
          description: 사용자 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/User'
                        - type: object
                          properties:
                            groups:
                              type: array
                              description: 소속 그룹 이름(읽기 전용, 이름 순)
                              items:
                                type: string
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 로컬 사용자 생성(관리자). 임시 비밀번호를 발급해 응답에 한 번만 담는다
      operationId: createUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_id, display_name]
              properties:
                login_id:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]{0,99}$'
                display_name:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  format: email
                  nullable: true
                role:
                  type: string
                  enum: [admin, user]
                  default: user
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TempPasswordResponse'
        '400':
          description: invalid_login_id, invalid_display_name(없음·100자 초과·제어/양방향 서식 문자), invalid_email(형식·254자 초과), display_name_reserved(다른 사용자의 로그인 ID와 같은 표시 이름, X06)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: login_id_taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/me/preferences:
    put:
      summary: 본인의 화면 언어·테마 저장(P27D). 다른 사용자의 값을 바꾸는 API는 없다. null = 계정 값을 지워 자동 결정
      operationId: updateMyPreferences
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 둘 중 하나만 보내도 된다(다른 키는 400)
              properties:
                language: {type: string, nullable: true, enum: [ko, en, null]}
                theme: {type: string, nullable: true, enum: [light, dark, system, null]}
      responses:
        '200':
          description: '{data:{ui_language, ui_theme, effective_language, effective_theme}}'
        '400':
          description: invalid_preferences(허용 밖 값·빈 요청·다른 키)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/me:
    get:
      summary: 내 정보(로그인한 모든 사용자, X05). 비밀번호·잠금 관련 값은 돌려주지 않는다
      operationId: getMe
      tags: [users]
      responses:
        '200':
          description: 본인 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      summary: 본인의 표시 이름·이메일 수정(X05). 관리자 PATCH /api/v1/users/{id}와 같은 규칙
      operationId: updateMe
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 보낸 필드만 바꾼다. 다른 필드(role, login_id, status, auth_type, password …)는 무시한다
              properties:
                display_name:
                  type: string
                  description: 앞뒤 공백 제거·NFC, 1~100자, 제어 문자 금지, 다른 사용자의 로그인 ID와 같으면 거부(대소문자 무시)
                email:
                  type: string
                  nullable: true
                  description: 선택. 비우면 NULL, 254자 이하, 단순 형식 검사, 중복 허용
      responses:
        '200':
          description: 수정됨(또는 변경 없음)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
        '400':
          description: display_name_required, display_name_too_long, display_name_invalid, display_name_reserved, email_invalid, email_too_long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: csrf_invalid, password_change_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: ldap_managed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}:
    delete:
      summary: 승인된 적 없는 계정(승인 대기·거절, P28B)만 지운다. 승인된 계정은 409 user_not_deletable(비활성화만, 명세 13). updated_at이 지금 값과 다르면 409 approval_conflict
      operationId: deletePendingUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: updated_at
          in: query
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{data:{deleted:true}}'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: user_not_deletable, approval_conflict
    get:
      summary: 사용자 조회(관리자)
      operationId: getUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: 표시 이름·이메일 수정(관리자, X05). 계정 삭제 API는 없다(비활성화만, 명세 13)
      description: |
        "내 정보"(PATCH /api/v1/users/me)와 같은 서비스(UserService::updateProfile). 둘 다 현재 값과 같으면 저장·감사 로그 없이 200.
        감사 로그 user.update(이메일은 a***@도메인으로 가림). LDAP 계정은 409 ldap_managed.
      operationId: updateUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 보낸 필드만 바꾼다. 다른 필드(role, login_id, status, auth_type, password …)는 무시한다
              properties:
                display_name:
                  type: string
                  description: 앞뒤 공백 제거·NFC, 1~100자, 제어 문자 금지, 다른 사용자의 로그인 ID와 같으면 거부(대소문자 무시)
                email:
                  type: string
                  nullable: true
                  description: 선택. 비우면 NULL, 254자 이하, 단순 형식 검사, 중복 허용
      responses:
        '200':
          description: 수정됨(또는 변경 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserData'
        '400':
          description: display_name_required, display_name_too_long, display_name_invalid, display_name_reserved, email_invalid, email_too_long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: ldap_managed(LDAP 계정은 이름·이메일을 디렉터리에서 가져옴)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/{id}/role:
    put:
      summary: 역할 변경(관리자). 대상 사용자의 세션은 즉시 폐기된다
      operationId: changeUserRole
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, user]
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/LastAdmin'
  /api/v1/users/{id}/status:
    put:
      summary: 활성화·비활성화(관리자). 비활성화하면 세션이 즉시 폐기된다
      operationId: changeUserStatus
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/LastAdmin'
  /api/v1/users/{id}/temp-password:
    post:
      summary: 임시 비밀번호 발급(관리자, 24시간 유효). 잠금 해제·세션 폐기가 함께 일어난다
      operationId: issueTempPassword
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 발급됨(임시 비밀번호는 이 응답에만 있다)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      temp_password:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                      user:
                        $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: not_local_account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}/password:
    put:
      summary: 관리자가 다른 사용자의 비밀번호를 정함(관리자)
      description: |
        비밀번호 정책(명세 3장: 8자 이상, 2종 이상)을 적용한다. 대상 사용자에게 변경을 강제하지 않고,
        다음 로그인 때 "관리자가 비밀번호를 변경했다"는 알림을 한 번 보여 준다(로그인 응답의 notice).
        대상의 세션은 즉시 폐기되고 잠금·임시 비밀번호 상태는 해제된다. 본인 비밀번호는 /api/v1/auth/password로 바꾼다.
      operationId: setUserPassword
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: 변경됨(응답에 비밀번호는 없다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserData'
        '400':
          description: password_policy, self_password_change, invalid_input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: not_local_account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}/unlock:
    post:
      summary: 계정 잠금 해제(관리자)
      operationId: unlockUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 해제됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserData'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/{id}/approve:
    post:
      summary: 승인 대기·거절 계정 승인(P28B, 외부 인증 첫 로그인). 활성 + 역할(user 기본·admin). 다른 관리자가 먼저 처리했으면 409 approval_conflict. 감사 user.approve
      operationId: approveUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                role: {type: string, enum: [user, admin], default: user}
                updated_at: {type: string, description: 목록에서 받은 updated_at(낙관적 잠금)}
      responses:
        '200':
          description: '{data: 사용자}'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: approval_conflict
  /api/v1/users/{id}/reject:
    post:
      summary: 승인 대기 거절(P28B). 계정은 rejected로 남아 같은 사람의 재요청이 쌓이지 않는다. 감사 user.reject
      operationId: rejectUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string}
      responses:
        '200':
          description: '{data: 사용자}'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: approval_conflict
  /api/v1/users/{id}/auth-type:
    put:
      summary: >-
        인증 방식 전환(P28B, 관리자): local ↔ 켜진 외부 방식(ldap). 외부로 바꾸면 비밀번호를 지우고 첫 로그인 때 로그인 ID로 외부 신원과 연결,
        local로 바꾸면 임시 비밀번호(24시간, 변경 강제)를 이 응답에만 한 번. 대상 세션 즉시 폐기, 감사 user.auth_type_change.
        자기 자신 400 self_auth_type_change, 마지막 활성 로컬 관리자 409 last_admin, 꺼진 방식 400 auth_type_not_enabled, 승인 안 된 계정 409 account_not_approved
      operationId: changeUserAuthType
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_type]
              properties:
                auth_type: {type: string, enum: [local, ldap, oidc, saml]}
      responses:
        '200':
          description: '{data:{user, temp_password: string|null, temp_password_expires_at: string|null}}'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: last_admin, account_not_approved
  /api/v1/admin/auth/ldap:
    get:
      summary: LDAP/AD 상태(P28B, admin) — {enabled, extension_loaded, configured, servers(수), bind_password(set|none|unreadable), ca_file(none|ok|missing)}. 비밀번호·바인드 DN 원문 없음
      operationId: adminLdapStatus
      tags: [admin]
      responses:
        '200':
          description: 상태
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/ldap/bind-password:
    put:
      summary: LDAP 검색 계정 비밀번호 저장·교체(P28B, admin). SecretBox로 암호화해 app_secrets에만. 값은 다시 내리지 않는다. 감사 auth.ldap_secret_set(값 없음)
      operationId: adminLdapBindPasswordPut
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, maxLength: 1024, format: password}
      responses:
        '200':
          description: '{data:{bind_password:"set"}}'
        '400':
          description: app_secret_invalid
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: repo_secret_key_missing(암호화 키 없음)
    delete:
      summary: LDAP 검색 계정 비밀번호 삭제(P28B, admin)
      operationId: adminLdapBindPasswordDelete
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{data:{bind_password:"none"}}'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/ldap/test:
    post:
      summary: >-
        LDAP 연결 시험(P28B, admin): 서버 연결(TLS)·검색 계정 바인드·Base DN·시험용 로그인 ID 검색(선택, 비밀번호 묻지 않음).
        응답 {data:{ok, steps:[{step: connect|service_bind|base_dn|user_search, ok: true|false|null(건너뜀), code, detail(가린 DN·식별자·이메일)}]}}.
        사용자당 분당 ldap.test_per_minute회(초과 429 ldap_test_rate_limited)
      operationId: adminLdapTest
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                login_id: {type: string, nullable: true, maxLength: 100}
      responses:
        '200':
          description: 단계별 결과
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: ldap_test_rate_limited
  /api/v1/admin/auth/oidc:
    get:
      summary: >-
        SSO(OIDC) 상태(P28C, admin) — {enabled, schema_ready(마이그레이션 027), configured(발급자·클라이언트 ID), client_auth(basic|post|none),
        client_secret(set|none|unreadable), redirect_uri(IdP에 등록할 <공개 주소>/auth/oidc/callback), post_logout_uri}. 비밀 원문 없음
      operationId: adminOidcStatus
      tags: [admin]
      responses:
        '200':
          description: 상태
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/oidc/client-secret:
    put:
      summary: OIDC 클라이언트 비밀 저장·교체(P28C, admin). SecretBox로 암호화해 app_secrets(oidc.client_secret)에만. 값은 다시 내리지 않는다. 감사 auth.oidc_secret_set(값 없음)
      operationId: adminOidcClientSecretPut
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: {type: string, maxLength: 1024, format: password}
      responses:
        '200':
          description: '{data:{client_secret:"set"}}'
        '400':
          description: app_secret_invalid
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: repo_secret_key_missing(암호화 키 없음) | app_secret_migration_required(마이그레이션 027 전)
    delete:
      summary: OIDC 클라이언트 비밀 삭제(P28C, admin). 감사 auth.oidc_secret_delete
      operationId: adminOidcClientSecretDelete
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{data:{client_secret:"none"}}'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/oidc/test:
    post:
      summary: >-
        OIDC 연결 시험(P28C, admin): 디스커버리 가져오기·issuer 일치 → JWKS 키 개수·쓸 수 있는 알고리즘 → 토큰 엔드포인트 도달(자격 증명 없이 보내 4xx면 도달).
        응답 {data:{ok, steps:[{step: discovery|jwks|token_endpoint, ok: true|false|null(건너뜀), code, detail}]}}. 비밀·토큰 없음.
        https만·주소 판정(P26B)·연결 5초·전체 10초·1 MiB. 사용자당 분당 oidc.test_per_minute회(초과 429 oidc_test_rate_limited)
      operationId: adminOidcTest
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 단계별 결과
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: oidc_test_rate_limited
  /api/v1/admin/auth/saml:
    get:
      summary: >-
        SSO(SAML) 상태(P28D, admin) — {enabled, schema_ready(마이그레이션 027), configured, sp_entity_id, acs_url, metadata_url, sp_key(set|none|unreadable),
        sp_cert({not_after, fingerprint}|null), sp_key_needed, idp_certs([{which: current|next, valid, not_after, days_left, subject, fingerprint}]), warn_days}. 개인 키 없음
      operationId: adminSamlStatus
      tags: [admin]
      responses:
        '200':
          description: 상태
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/saml/sp-key:
    post:
      summary: SP 개인 키(RSA 2048)·자체 서명 인증서(10년) 생성 — 있으면 교체(P28D, admin). app_secrets에 암호화, 개인 키는 내리지 않는다. 감사 auth.saml_sp_key_generate. 응답은 새 상태
      operationId: adminSamlSpKeyGenerate
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 새 상태(GET /api/v1/admin/auth/saml과 같은 모양)
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: app_secret_migration_required(027 전) | repo_secret_key_missing(암호화 키 없음)
        '500':
          description: saml_key_generate_failed
    delete:
      summary: SP 키·인증서 삭제(P28D, admin). 감사 auth.saml_sp_key_delete
      operationId: adminSamlSpKeyDelete
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 새 상태
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/saml/metadata-import:
    post:
      summary: >-
        IdP 메타데이터에서 값 읽기(P28D, admin) — 저장하지 않고 {idp_entity_id, idp_sso_url, idp_cert, idp_cert_next, certs}만 돌려준다(설정 화면이 채우고 관리자가 저장).
        xml(1 MiB, DOCTYPE·엔티티 거부) 또는 url(https, 주소 판정·크기·시간 상한). 분당 saml.test_per_minute회(설정 확인과 합산)
      operationId: adminSamlMetadataImport
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                xml: {type: string}
                url: {type: string, format: uri}
      responses:
        '200':
          description: 읽은 값
        '400':
          description: saml_metadata_invalid | saml_metadata_url_invalid
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: saml_test_rate_limited
        '502':
          description: saml_metadata_unreachable
  /api/v1/admin/auth/saml/test:
    post:
      summary: >-
        SAML 설정 확인(P28D, admin): IdP 인증서(형식·만료, 현재·다음) → SSO 주소 도달(https, 4xx도 도달) → SP 설정(키가 필요하면 있는지) → SP 메타데이터.
        응답 {data:{ok, steps:[{step: idp_cert|sso_url|sp|sp_metadata, ok: true|false|null(건너뜀), code, detail}]}}. 실제 로그인은 하지 않는다
      operationId: adminSamlTest
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 단계별 결과
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: saml_test_rate_limited
  /api/v1/admin/alert-mail:
    get:
      summary: >-
        관리자 장애 이메일 상태(P30B, admin). 응답 {data:{enabled, ready, state: off|setup|on, missing:[migration|smtp_host|from_address|smtp_user|password|recipients],
        password: set|none|unreadable, plaintext, migration, recipients(수), recipients_source: list|admins, tls}}. 비밀·주소 원문 없음
      operationId: adminAlertMailStatus
      tags: [admin]
      responses:
        '200':
          description: 상태
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/alert-mail/password:
    put:
      summary: 관리자 이메일 SMTP 비밀번호 저장·교체(P30B, admin). SecretBox로 암호화해 app_secrets(mail.smtp_password)에만. 값은 다시 내리지 않는다. 감사 mail.secret_set(값 없음)
      operationId: adminAlertMailPasswordPut
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, maxLength: 1024, format: password}
      responses:
        '200':
          description: '{data:{password:"set"}}'
        '400':
          description: app_secret_invalid
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: repo_secret_key_missing(암호화 키 없음)
    delete:
      summary: 관리자 이메일 SMTP 비밀번호 삭제(P30B, admin). 감사 mail.secret_delete
      operationId: adminAlertMailPasswordDelete
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{data:{password:"none"}}'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/alert-mail/test:
    post:
      summary: >-
        시험 메일 한 통(P30B, admin): 저장된 설정으로만(저장하지 않은 입력은 쓰지 않음). 받는 사람 to(생략하면 로그인한 관리자 이메일).
        응답 {data:{ok, code: null|connect|tls|auth|rejected|timeout|config|invalid}}. 사용자당 분당 3회·전체 시간당 20회. 감사 mail.test(받는 사람 가림)
      operationId: adminAlertMailTest
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to: {type: string, maxLength: 254, format: email}
      responses:
        '200':
          description: 발송 결과(실패도 200 + ok false·code)
        '400':
          description: alert_mail_invalid_recipient
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: alert_mail_not_configured(details.missing)
        '429':
          description: alert_mail_test_rate_limited | alert_mail_test_hourly_limited
  /api/v1/guide/user:
    get:
      summary: >-
        사용자 가이드(P29, 로그인한 모든 사용자). 화면 언어(P27D)로 {audience, lang, sections:[{key, title, order, summary, keywords, related, fallback(번역 없음 → 한국어), lang, body(마크다운 — 설정 값·버전·화면 문구 자리표시자는 서버가 채움, {{icon:…}}만 그대로)}],
        images:{slug:{width,height}}}. 렌더는 브라우저의 안전한 마크다운 렌더러(textContent). Cache-Control: private
      operationId: guideUser
      tags: [guide]
      responses:
        '200':
          description: 절 목록
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/guide/user/search:
    get:
      summary: 사용자 가이드 검색(P29) — 최소 2자, 대소문자 무시. {q, results:[{key, title, summary, hits}]}. 관리자 가이드는 포함하지 않는다
      operationId: guideUserSearch
      tags: [guide]
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: 결과(2자 미만이면 빈 목록)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/guide/errors:
    get:
      summary: >-
        오류 코드 탭(P29) — 카탈로그 전체 {groups:[{kind: upload|analysis|sso, title, guide_key(사용자 가이드 절), items:[{code, known, title, cause, action, guide_key}]}]}. 사용자에게 보이는 문구만(내부 사유 없음)
      operationId: guideErrors
      tags: [guide]
      responses:
        '200':
          description: 오류 코드 목록
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/guide/admin:
    get:
      summary: 관리자 가이드(P29 구조 — 본문은 P29C, admin만). 응답 모양은 /api/v1/guide/user와 같다. 비관리자 403(본문·제목·건수 없음)
      operationId: guideAdmin
      tags: [guide]
      responses:
        '200':
          description: 절 목록
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/guide/admin/search:
    get:
      summary: 관리자 가이드 검색(P29, admin만 — 관리자 가이드 안에서만). 비관리자 403
      operationId: guideAdminSearch
      tags: [guide]
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: 결과
        '403':
          $ref: '#/components/responses/Forbidden'
  /health:
    get:
      summary: >-
        헬스체크(P30, 명세 19.3). 인증 없음 — 허용 IP(health.allowed_ips, CIDR, 접속 주소 — 신뢰 프록시(security.trusted_proxies, P32B)를 거친 요청만 X-Forwarded-For)에서만 응답하고
        허용 밖·빈 목록은 등록되지 않은 경로와 같은 404(존재를 알리지 않음). 고정 스키마, 식별 정보(프로젝트·사용자 이름·경로·비밀) 없음.
        status ok·warn → 200, fail → 503. 허용 IP당 분당 health.per_minute회(넘으면 429 health_rate_limited), 같은 본문을 health.cache 동안 다시 씀.
        판정은 시스템 모니터링·관리자 배너와 같은 SystemHealth(docs/monitoring.md)
      operationId: health
      tags: [monitoring]
      security: []
      responses:
        '200':
          description: 'ok 또는 warn — {status, time, checks:{worker:{alive, last_seen}, db:{ok}, disk:{used_percent, state}, backup:{last_success_at, state}, queue:{waiting, oldest_wait_seconds, stalled}}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '404':
          description: 허용 IP 밖(등록되지 않은 경로와 같은 응답)
        '429':
          description: health_rate_limited
        '503':
          description: fail — 본문은 200과 같은 스키마
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/admin/monitoring:
    get:
      summary: >-
        시스템 모니터링(P30, admin만 — 그 밖 403). {checked_at, status(ok|warn|fail), alerts:[{code, level, params}], cards:{worker, queue, disk, failures, backup, tools,
        schedules, cert, app — 값을 못 구한 카드는 {available:false, reason}}, refresh_seconds}. 판정 캐시 monitoring.cache, ?refresh=1이면 다시 판정
      operationId: adminMonitoring
      tags: [monitoring]
      parameters:
        - name: refresh
          in: query
          schema: {type: string, enum: ['1']}
      responses:
        '200':
          description: 판정 결과
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/audit-logs:
    get:
      summary: >-
        감사 로그 목록(P30, admin만, 읽기 전용 — 수정·삭제 API 없음). 최신순, page/size(기본 50, 최대 200). 조건: days(1·7·30·90) 또는 from·to(UTC ISO 8601),
        actor(로그인 ID 부분 일치), action(작업 이름 또는 "접두사." — docs/audit_actions.md), target(종류 또는 종류:id 부분 일치), q(행위자·작업·대상·세부 정보 부분 일치).
        세부 정보는 화면 단계에서 한 번 더 마스킹. 응답 meta {filter, prefixes, actions, range(보관 경계·남은 범위)}. 형식 오류 400 invalid_audit_filter(details.field).
        X17: 각 행에 사람이 읽는 설명 summary·fields·target_label 등(AuditLogEntry, 화면 언어) — 대상 이름은 한 쪽 단위 일괄 조회
      operationId: adminAuditLogs
      tags: [audit]
      parameters:
        - {name: days, in: query, schema: {type: string, enum: ['1', '7', '30', '90']}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: actor, in: query, schema: {type: string, maxLength: 100}}
        - {name: action, in: query, schema: {type: string, maxLength: 100}}
        - {name: target, in: query, schema: {type: string, maxLength: 100}}
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AuditLogEntry'}}
                  page: {type: object}
                  meta: {type: object}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/audit-logs/integrity:
    get:
      summary: >-
        무결성 검사 한 조각(P30, admin만). id가 after보다 큰 행부터 limit개(최대 20,000)의 해시 체인을 확인 — 첫 행은 DB에서 다시 읽은 직전 행 hash(없으면
        보관 기준점)와 비교. {ok, checked, broken_at, broken_at_time, reason(prev_hash_mismatch|hash_mismatch), last_id, done, range?}. 화면이 done까지 이어 부른다.
        검사 실행은 감사 로그가 아니라 앱 로그에만
      operationId: adminAuditIntegrity
      tags: [audit]
      parameters:
        - {name: after, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 20000}}
      responses:
        '200':
          description: 검사 결과
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/audit-logs/{id}:
    get:
      summary: 감사 로그 한 행(P30, admin만) — 세부 정보 전체(가려진 값)·이전 해시·해시 + 사람이 읽는 설명(X17 summary·fields·target_label…). 없으면 404 audit_not_found
      operationId: adminAuditLog
      tags: [audit]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: 한 행
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/AuditLogEntry'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/audit-logs/export:
    post:
      summary: >-
        감사 로그 CSV 내보내기(P30, admin만, CSRF). 본문은 목록과 같은 조건 {days|from·to, actor, action, target, q}. 최대 export.max_rows행(넘으면 413 export_too_large,
        0건 409 export_empty), UTF-8 BOM·수식 시작 글자 앞 '(P23 규칙). 마지막 열 "설명" = 화면 언어의 한 문장 요약(X17, 앞 열 순서·이름 그대로). 내보낸 사실은 감사 로그 audit.export
      operationId: adminAuditExport
      tags: [audit]
      responses:
        '200':
          description: text/csv 파일(X-Export-Rows)
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: export_empty
        '413':
          description: export_too_large
        '429':
          description: export_busy
  /api/v1/faq:
    get:
      summary: >-
        FAQ 목록(P29B, 로그인한 모든 사용자). {items:[{id, category, question, answer(마크다운 부분집합 원문), sort_order, version, updated_at — admin에게만 is_published·updated_by_name}],
        categories(보이는 분류, 분류 순서), total}. 비공개 항목은 admin에게만 — 일반 사용자 응답에는 항목·건수·분류가 없다. 검색 q는 분류·질문·답변(대소문자 무시, 낱말 AND, %·_ 는 글자).
        029 전에는 503 faq_unavailable
      operationId: faqList
      tags: [faq]
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: category
          in: query
          schema: {type: string, maxLength: 40}
        - name: include_drafts
          in: query
          description: admin만 의미 있음(기본 1, 0이면 공개 항목만)
          schema: {type: string, enum: ['0', '1']}
      responses:
        '200':
          description: 목록
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: faq_unavailable(마이그레이션 029 전)
  /api/v1/faq/{id}:
    get:
      summary: FAQ 한 항목(P29B). 일반 사용자에게 비공개 항목은 없는 항목과 같은 404
      operationId: faqGet
      tags: [faq]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 항목
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/faq:
    post:
      summary: >-
        FAQ 추가(P29B, admin만 — 그룹 관리자·일반 사용자 403, CSRF). {category(1~40), question(1~200), answer(1~10,000, 마크다운 부분집합), is_published?(기본 true)} →
        201 항목. 공백 정리·NFC. 항목 500개 상한(400 faq_limit). 새 항목은 맨 끝. 감사 faq.create(답변은 길이·해시만)
      operationId: faqCreate
      tags: [faq]
      responses:
        '201':
          description: 추가한 항목
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/faq/reorder:
    post:
      summary: >-
        같은 분류 안 순서 바꾸기(P29B, admin만). {category, ids:[그 분류의 모든 항목(비공개 포함)을 새 순서로]} — 실제 목록과 다르면 409 faq_order_conflict + details.current(id 목록),
        한 트랜잭션. 다른 분류·version은 그대로. 감사 faq.reorder
      operationId: faqReorder
      tags: [faq]
      responses:
        '200':
          description: '{items: 그 분류의 항목(새 순서)}'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: faq_order_conflict
  /api/v1/admin/faq/{id}:
    patch:
      summary: >-
        FAQ 수정(P29B, admin만). {version(필수), category?, question?, answer?, is_published?} → {item, changed}. version이 다르면 409 faq_conflict + details.current(최신 항목).
        값이 모두 같으면 쓰지 않음(changed false). 분류를 바꾸면 새 분류의 맨 끝. 감사 faq.update(바뀐 필드·답변 길이·해시)·faq.publish(공개 여부)
      operationId: faqUpdate
      tags: [faq]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: 수정 결과
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: faq_conflict
    delete:
      summary: FAQ 삭제(P29B, admin만). 감사 faq.delete(질문 제목 포함). 없으면 404
      operationId: faqDelete
      tags: [faq]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: '{deleted: true}'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/account-import/template:
    get:
      summary: 계정 CSV 양식(P28A, admin). UTF-8 BOM, 머리글(action, login_id, display_name, email, role, auth_type) + 예시 2행
      operationId: accountImportTemplate
      tags: [users]
      responses:
        '200':
          description: CSV 파일(attachment accounts_template.csv)
          content:
            text/csv:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/account-import/preview:
    post:
      summary: >-
        계정 CSV 미리보기(P28A, admin). 본문 = CSV 파일 그대로(최대 2 MiB, 1,000행). 읽기·검증만 하고 저장하지 않는다.
        응답 {data:{encoding(utf-8|cp949|null), encoding_requested, bom, file_sha256, digest, columns, file_errors:[{code,params}], file_warnings,
        limits, auth_types, summary:{rows, create, deactivate, skip, error, warning, ok, admin_create},
        rows:[{row, action, login_id, display_name, email, role, auth_type, user_id, status(ok|warning|error), plan(create|deactivate|skip|none), codes}]}}.
        파일 단위 오류(인코딩·머리글·한도)는 200 + file_errors. 비밀번호 해시·임시 비밀번호는 없다
      operationId: accountImportPreview
      tags: [users]
      parameters:
        - name: encoding
          in: query
          schema: {type: string, enum: [auto, utf-8, cp949], default: auto}
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: 미리보기(저장 없음)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: import_file_too_large(2 MiB 초과)
  /api/v1/admin/account-import/execute:
    post:
      summary: >-
        계정 CSV 실행(P28A, admin). 본문 = 미리보기와 같은 파일. 다시 검증해 digest가 미리보기와 같을 때만 전부 반영(한 트랜잭션, 일부 반영 없음).
        응답 {data:{summary(+created, deactivated), temp_password_hours, rows:[{row, action, login_id, codes, result(created|deactivated|skipped|error),
        user_id?, role?, display_name?, temp_password?, temp_password_expires_at?}]}} — 임시 비밀번호는 이 응답에만 한 번(서버 보관 없음)
      operationId: accountImportExecute
      tags: [users]
      parameters:
        - name: encoding
          in: query
          schema: {type: string, enum: [auto, utf-8, cp949], default: auto}
        - name: digest
          in: query
          required: true
          description: 미리보기 응답의 digest(SHA-256 16진수 64자)
          schema: {type: string}
        - name: skip_errors
          in: query
          description: 1이면 오류 행을 건너뛰고 실행(없으면 오류 행이 있을 때 422)
          schema: {type: string, enum: ['0', '1'], default: '0'}
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: 처리 결과
        '400':
          description: import_digest_required, import_file_required, import_encoding_invalid, import_file_invalid
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: import_preview_stale(파일이 다르거나 미리보기 뒤 판정이 바뀜 — 아무것도 반영하지 않음)
        '413':
          description: import_file_too_large
        '422':
          description: import_has_errors(오류 행, skip_errors 없음), import_nothing_to_do
  /api/v1/projects:
    get:
      summary: 프로젝트 목록. 볼 수 있는 프로젝트만(admin = 전체, 일반 사용자 = 직접 또는 그룹으로 매핑된 프로젝트, 명세 3.1)
      operationId: listProjects
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          description: 이름·설명 부분 일치
          schema:
            type: string
      responses:
        '200':
          description: 프로젝트 목록(이름순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: 프로젝트 생성(관리자)
      operationId: createProject
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, language]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: 앞뒤 공백을 지우고 저장. 대소문자 무시 유일
                language:
                  type: string
                  enum: [python, javascript]
                  description: 만든 뒤에는 바꿀 수 없다
                description:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailData'
        '400':
          description: invalid_project_name, invalid_language, invalid_description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: project_name_taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/default-excludes:
    get:
      summary: 서버 기본 제외 목록(브라우저가 폴더를 묶기 전에 미리 뺄 이름, P12)
      description: 경로 조각이 이름과 정확히 같을 때만 제외한다(예 node_modules). 설정 extract.default_excludes.
      operationId: getDefaultExcludes
      tags: [projects]
      responses:
        '200':
          description: 기본 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      names:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/projects/{id}:
    get:
      summary: 프로젝트 상세(볼 수 있는 사용자, 보이지 않으면 404). strip_top_folder·access는 관리자에게만
      operationId: getProject
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 상세(제외 목록, 최근 분석 요약)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailData'
        '404':
          description: project_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: 프로젝트 수정(관리자). 이름·설명·추가 제외 패턴. 언어를 다른 값으로 보내면 409
      operationId: updateProject
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                exclude_patterns:
                  type: array
                  maxItems: 100
                  description: 한 줄에 하나. 문법은 docs/architecture.md "제외 패턴". 공백·빈 줄·중복은 서버가 정리
                  items:
                    type: string
                language:
                  type: string
                  description: 보내지 않는다. 지금 값과 다르면 409 language_immutable
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailData'
        '400':
          description: invalid_project_name, invalid_description, invalid_exclude_pattern, too_many_exclude_patterns, invalid_input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: project_name_taken, language_immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: 프로젝트 즉시 영구 삭제(관리자). 결함·분석 이력·스냅샷·업로드·작업 디렉토리가 함께 사라진다
      description: |
        confirm_name이 프로젝트 이름과 정확히 같아야 한다(서버 검사). 대기·실행 중 분석이나 처리 중 업로드가 있으면 409 project_busy.
        DB 행을 먼저 지우고, 파일 삭제에 실패하면 로그와 정리 대상 목록에 남기며 삭제는 성공으로 응답한다(file_cleanup_failures).
      operationId: deleteProject
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties:
                confirm_name:
                  type: string
      responses:
        '200':
          description: 삭제됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                      file_cleanup_failures:
                        type: integer
        '400':
          description: project_name_mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: project_busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{id}/deletion-info:
    get:
      summary: 삭제 확인 정보(관리자) — 삭제될 분석 횟수, 결함 건수, 스냅샷 크기
      operationId: getProjectDeletionInfo
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 삭제될 양
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      analyses:
                        type: integer
                      defects:
                        type: integer
                      snapshot_bytes:
                        type: integer
                      uploads:
                        type: integer
                      access_mappings:
                        type: integer
                        description: 함께 사라질 접근 매핑 수(P11B)
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/{id}/access:
    get:
      summary: 접근 매핑 조회(관리자). 매핑된 그룹·사용자와 관리자를 뺀 "볼 수 있는 사람 수"(명세 3.1)
      operationId: getProjectAccess
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 매핑
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAccessData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    post:
      summary: 접근 매핑 추가(관리자). 그룹 하나 또는 사용자 하나
      operationId: addProjectAccess
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type]
              properties:
                subject_type:
                  type: string
                  enum: [group, user]
                group_id:
                  type: integer
                  description: subject_type=group일 때
                login_id:
                  type: string
                  description: subject_type=user일 때(사용자 검색 결과의 로그인 ID)
      responses:
        '201':
          description: 추가 후의 매핑
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAccessData'
        '400':
          description: invalid_input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: project_not_found, group_not_found, user_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: access_exists, user_inactive, admin_implicit_access(관리자는 항상 볼 수 있어 매핑하지 않음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{id}/access/{subjectType}/{subjectId}:
    delete:
      summary: 접근 매핑 제거(관리자). 다음 요청부터 반영
      operationId: removeProjectAccess
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: subjectType
          in: path
          required: true
          schema:
            type: string
            enum: [group, user]
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 제거 후의 매핑
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAccessData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: project_not_found, access_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{id}/uploads:
    post:
      summary: 업로드 시작(init). 볼 수 있는 프로젝트만(보이지 않거나 없으면 404). 한도·동시 업로드·디스크 사전 검사 후 upload_id 발급
      description: |
        청크 크기와 청크 수를 돌려준다. 디스크 예약 = 크기 + max(크기, 해제 상한)(docs/architecture.md 20절).
        진행 중 업로드의 예약을 합산해 여유를 판정하고, 디스크 사용률 90% 이상이면 차단한다(명세 19.3).
      operationId: initUpload
      tags: [uploads]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, total_size]
              properties:
                file_name:
                  type: string
                  maxLength: 255
                  description: 표시용. 경로에 쓰지 않는다
                total_size:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: 업로드 시작
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      upload_id:
                        type: string
                        pattern: '^[0-9a-f]{32}$'
                      chunk_size:
                        type: integer
                      total_chunks:
                        type: integer
                      max_bytes:
                        type: integer
        '400':
          description: invalid_upload_size, invalid_file_name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '413':
          description: upload_too_large(설정 upload.max_zip_size, 기본 2GB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: too_many_uploads(사용자당 동시 진행 업로드 수, 설정 upload.max_concurrent_per_user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '507':
          description: insufficient_storage(필요량·여유량을 문구에), disk_usage_blocked(사용률 차단)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/uploads/{id}:
    get:
      summary: 업로드 상태(화면이 폴링). 업로드한 사용자만(다른 사용자·볼 수 없는 프로젝트는 404)
      operationId: getUpload
      tags: [uploads]
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Upload'
        '404':
          $ref: '#/components/responses/UploadNotFound'
    delete:
      summary: 업로드 취소(받는 중·확인 대기만). 조각 폴더 삭제, 상태 aborted
      operationId: abortUpload
      tags: [uploads]
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 취소됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatusChange'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '409':
          description: upload_not_abortable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/uploads/{id}/status:
    get:
      summary: 이어 올리기용 상태. 받은 청크 번호와 각 SHA-256(받는 중일 때만)
      operationId: getUploadChunks
      tags: [uploads]
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: 받은 청크
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      upload_id:
                        type: string
                      status:
                        type: string
                      total_size:
                        type: integer
                      chunk_size:
                        type: integer
                      total_chunks:
                        type: integer
                      received:
                        type: array
                        items:
                          type: object
                          properties:
                            index:
                              type: integer
                            sha256:
                              type: string
        '404':
          $ref: '#/components/responses/UploadNotFound'
  /api/v1/uploads/{id}/chunks/{index}:
    put:
      summary: 청크 전송. 본문은 청크 그대로(multipart 아님), 헤더 X-Chunk-Sha256. 같은 청크 재전송은 덮어쓴다(멱등)
      operationId: putUploadChunk
      tags: [uploads]
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: index
          in: path
          required: true
          description: 0부터. 정수가 아니거나 범위 밖이면 400 invalid_chunk_index
          schema:
            type: integer
            minimum: 0
        - name: X-Chunk-Sha256
          in: header
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      index:
                        type: integer
                      received:
                        type: integer
                      total_chunks:
                        type: integer
        '400':
          description: invalid_chunk_index, invalid_chunk_hash, invalid_chunk_length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '409':
          description: upload_not_receiving(이미 완료·취소)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: chunk_hash_mismatch(다시 보낸다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/uploads/{id}/complete:
    post:
      summary: 전송 완료. 모든 청크를 확인하고 조립 대기(assemble_pending)로 바꿔 202. 조립은 워커가 한다
      operationId: completeUpload
      tags: [uploads]
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 조립 대기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatusChange'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '409':
          description: chunks_missing(받지 못한 청크 수를 문구에), upload_not_receiving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/uploads/{id}/confirm:
    post:
      summary: 경고 확인 → 분석 대기열 등록(업로드한 사용자 본인만, 상태 needs_confirmation일 때). 취소는 DELETE /api/v1/uploads/{id}
      description: 두 번 눌러도 분석은 하나만 생긴다(두 번째는 409). 프로젝트의 최상위 폴더 규칙이 비어 있으면 해제 때 정한 값으로 확정한다.
      operationId: confirmUpload
      tags: [uploads]
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 분석 대기열 등록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      upload_id:
                        type: string
                      status:
                        type: string
                        enum: [queued]
                      analysis_id:
                        type: integer
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '409':
          description: upload_not_confirmable(확인할 경고가 없는 상태)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{id}/analyses:
    get:
      summary: 프로젝트의 분석 목록(최신순, 상태 필터·페이지). 프로젝트를 볼 수 있는 사용자 누구나
      description: 대기 순번(queue_position)은 queued만. 보이지 않는 프로젝트는 없는 프로젝트와 같은 404.
      operationId: listAnalyses
      tags: [analyses]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          description: 쉼표 구분 상태 목록(queued, running, succeeded, failed, cancelled). 생략하면 전체
          schema:
            type: string
        - name: trigger
          in: query
          description: 실행 주체(P26) — user(업로드·지금 가져와 분석) 또는 schedule(주기 분석). 생략하면 전체
          schema:
            type: string
            enum: [user, schedule]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 분석 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Analysis'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          description: invalid_status_filter, invalid_trigger_filter, invalid_pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/analyses/{id}:
    get:
      summary: 분석 상세(상태, 대기 순번, 요청자, 시각, 실패 코드·메시지). 화면이 상태를 주기적으로 조회한다(명세 5.2)
      operationId: getAnalysis
      tags: [analyses]
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: 분석
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Analysis'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/AnalysisNotFound'
  /api/v1/analyses/{id}/cancel:
    post:
      summary: 분석 취소(queued·running만, 요청한 사용자 본인 또는 admin)
      description: |
        queued는 즉시 cancelled. running은 cancel_requested=true가 되고 워커가 약 1초 안에 프로세스 트리를 종료해 cancelled로 기록한다
        (응답의 status는 아직 running일 수 있다). 취소해도 결함과 비교 기준(직전 성공 분석)은 바뀌지 않는다(명세 5.4).
        접근 검사가 먼저다: 보이지 않는 프로젝트의 분석은 404, 보이지만 본인·admin이 아니면 403.
      operationId: cancelAnalysis
      tags: [analyses]
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 취소됨(queued) 또는 취소 요청됨(running)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Analysis'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: analysis_cancel_forbidden(요청자 본인·admin이 아님), csrf_invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/AnalysisNotFound'
        '409':
          description: analysis_not_cancellable(이미 끝난 분석)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{id}/defects:
    get:
      summary: 결함 목록(필터·검색·정렬·페이지, 명세 6.4). 프로젝트를 볼 수 있는 사용자 누구나. 읽기 전용(수정은 P18)
      description: |
        다중 선택 필터는 쉼표 구분. 조건은 모두 AND, 한 필터 안의 값은 OR. 검색어(q)는 메시지·규칙 키·파일 경로의 부분 일치이며
        %, _, 따옴표 같은 글자를 그대로 찾는다(LIKE 와일드카드 이스케이프). 정렬은 허용 목록만(그 밖은 400 invalid_sort).
        보이지 않는 프로젝트는 없는 프로젝트와 같은 404.
      operationId: listDefects
      tags: [defects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DefectRule'
        - $ref: '#/components/parameters/DefectSeverity'
        - $ref: '#/components/parameters/DefectStatus'
        - $ref: '#/components/parameters/DefectAssignee'
        - $ref: '#/components/parameters/DefectFile'
        - $ref: '#/components/parameters/DefectFileMode'
        - $ref: '#/components/parameters/DefectQ'
        - $ref: '#/components/parameters/DefectAnalysis'
        - $ref: '#/components/parameters/DefectChange'
        - $ref: '#/components/parameters/DefectRun'
        - $ref: '#/components/parameters/DefectFromRun'
        - $ref: '#/components/parameters/DefectInRunFrom'
        - $ref: '#/components/parameters/DefectInRunTo'
        - name: sort
          in: query
          schema:
            type: string
            enum: [file, rule, severity, status, run, last_seen]
            default: file
          description: >-
            file = 파일·줄 순, severity = 치명적부터, status = open부터 진행 순, run = 마지막 감지 Run 번호 순(P21U, 번호 없음은 오름차순 맨 앞),
            last_seen = 마지막 감지 분석의 종료 시각 순(P21U). 과거 Run 보기(run=N)에서 run·last_seen은 N으로 한정한 값(last_detected_*)으로 정렬. 같은 값끼리는 id 순
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '410':
          $ref: '#/components/responses/RunDetailDeleted'
        '200':
          description: 결함 목록(page.total = 필터를 적용한 전체 건수)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DefectListItem'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          description: invalid_defect_filter, invalid_sort, invalid_pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: project_not_found(보이지 않는 프로젝트), run_not_found(없는 Run)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid_run(run이 정수가 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{id}/defects/summary:
    get:
      summary: 필터 요약(필터 칩의 건수)과 빈 상태 구분(분석 전 / 결함 0건)
      description: |
        목록과 같은 필터를 받는다. total은 모든 필터를 적용한 건수. severity·status·rules·assignees의 건수는 각자 자기 필터만 뺀 조건으로 센다
        (칩을 더 고르면 몇 건이 되는지 보이도록). rules는 건수 많은 순 상위 ui.page_size_max개 + 선택한 규칙.
      operationId: summarizeDefects
      tags: [defects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DefectRule'
        - $ref: '#/components/parameters/DefectSeverity'
        - $ref: '#/components/parameters/DefectStatus'
        - $ref: '#/components/parameters/DefectAssignee'
        - $ref: '#/components/parameters/DefectFile'
        - $ref: '#/components/parameters/DefectFileMode'
        - $ref: '#/components/parameters/DefectQ'
        - $ref: '#/components/parameters/DefectAnalysis'
        - $ref: '#/components/parameters/DefectChange'
        - $ref: '#/components/parameters/DefectRun'
        - $ref: '#/components/parameters/DefectFromRun'
        - $ref: '#/components/parameters/DefectInRunFrom'
        - $ref: '#/components/parameters/DefectInRunTo'
      responses:
        '410':
          $ref: '#/components/responses/RunDetailDeleted'
        '200':
          description: 요약
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DefectSummary'
        '400':
          description: invalid_defect_filter, invalid_sort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: project_not_found(보이지 않는 프로젝트), run_not_found(없는 Run)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid_run(run이 정수가 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/defects/{id}:
    get:
      summary: 결함 상세(담당자·비활성 표시, 심각도, 상태, 위치, version, 처음·마지막 감지 분석과 도구 버전)
      description: 처음 발생한 분석의 도구 버전은 first_seen.tool_version(명세 8). 결함 id → 소유 프로젝트로 접근 판정, 보이지 않으면 없는 결함과 같은 404.
      operationId: getDefect
      tags: [defects]
      parameters:
        - $ref: '#/components/parameters/DefectId'
        - $ref: '#/components/parameters/DefectRun'
      responses:
        '410':
          $ref: '#/components/responses/RunDetailDeleted'
        '200':
          description: 결함
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DefectDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DefectNotFound'
    patch:
      summary: 결함 담당자·심각도·상태 변경(명세 6.2). version으로 낙관적 잠금, 바뀐 필드마다 이력(사유 선택)
      description: |
        바꿀 필드만 보낸다(assignee_id는 null이면 해제). 상태 전이는 제한하지 않는다. 담당자는 이 프로젝트에 접근할 수 있는 활성 사용자만.
        값이 모두 같으면 아무것도 쓰지 않고 changed=false(이력·version 그대로). version이 현재 값과 다르면 409 version_conflict이고
        error.details.current에 최신 결함이 담긴다(분석의 자동 전환도 version을 올린다). 결함 갱신과 이력은 한 트랜잭션.
        로그인한 사용자 누구나(관리자 제한 없음). 보이지 않는 프로젝트의 결함은 없는 결함과 같은 404(권한 검사보다 먼저).
      operationId: updateDefect
      tags: [defects]
      parameters:
        - $ref: '#/components/parameters/DefectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DefectChanges'
                - type: object
                  required: [version]
                  properties:
                    version:
                      type: integer
                      minimum: 1
                    memo:
                      type: string
                      maxLength: 1000
                      description: 변경 사유(선택, 앞뒤 공백 제거, 줄바꿈 허용)
      responses:
        '200':
          description: 갱신된 결함
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/DefectDetail'
                      - type: object
                        properties:
                          changed:
                            type: boolean
                            description: false면 값이 모두 같아 아무것도 바꾸지 않음
        '400':
          description: invalid_version, no_change_fields, invalid_severity, invalid_status, invalid_assignee, invalid_memo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: csrf_invalid, password_change_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/DefectNotFound'
        '409':
          description: version_conflict. error.details.current = 최신 결함(DefectDetail)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/defects/{id}/history:
    get:
      summary: 결함 변경 이력(최신순, 페이지). 자동 전환은 changed_by가 null이고 reason_code·analysis_id가 있다(규칙 기본 심각도 일괄 적용 rule_default는 analysis_id null)
      operationId: listDefectHistory
      tags: [defects]
      parameters:
        - $ref: '#/components/parameters/DefectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 이력
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DefectHistoryEntry'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DefectNotFound'
  /api/v1/defects/{id}/code:
    get:
      summary: 결함 코드(마지막 감지 분석 기준, 명세 7). JSON 텍스트 줄 목록이며 HTML이 아니다
      description: |
        스냅샷이 full이면 그 분석의 source.zip에서 결함 파일을 읽어 mode=window(결함 줄 앞뒤 viewer.code_window_lines줄) 또는 mode=full(파일 전체,
        viewer.code_max_lines를 넘으면 window로 바꾸고 partial=true)로 돌려준다. 스냅샷이 정리된 분석이면 발췌(excerpt=true, 발췌 범위만)를 돌려준다.
        둘 다 없으면 source=none과 reason. 긴 줄은 viewer.code_max_line_length자로 자르고 truncated_lines에 줄 번호를 넣는다.
        UTF-8이 아닌 원본은 대체 문자(U+FFFD)로 바꾸고 content_replaced=true. 경로는 DB 값으로만 찾는다.
      operationId: getDefectCode
      tags: [defects]
      parameters:
        - $ref: '#/components/parameters/DefectId'
        - name: mode
          in: query
          schema:
            type: string
            enum: [window, full]
            default: window
        - $ref: '#/components/parameters/DefectRun'
      responses:
        '410':
          $ref: '#/components/responses/RunDetailDeleted'
        '200':
          description: 코드
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DefectCode'
        '400':
          description: invalid_code_mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DefectNotFound'
  /api/v1/projects/{id}/history:
    get:
      summary: 분석 이력(P21, 명세 8). 최신순, 모든 상태(대기·실행 중·실패·취소 포함 — 비교 열은 성공만)
      description: |
        행마다 분석 id·Run 번호·시각·소스·상태·도구 버전, 성공이면 신규·해결·재오픈·유지 건수(반영 때 저장한 값), 그 Run 종료 시점의 열린 결함 수와
        직전 성공 대비 증감, 버전/설정 변경(AnalysisComparison::differences, 대시보드 추이와 같은 함수)과 근거, 실패면 ErrorCatalog 제목.
        프로젝트를 볼 수 있는 사용자 누구나. 보이지 않는 프로젝트는 404.
      operationId: listHistory
      tags: [history]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: 기본 ui.history_page_size(20), 최대 ui.history_page_size_max(100)
          schema:
            type: integer
            minimum: 1
        - name: unchanged
          in: query
          description: 'P27: hide = 성공(변경 없음) 행을 빼고 센다(화면 "변경 없음 숨기기"), show(기본) = 보이기'
          schema:
            type: string
            enum: [show, hide]
      responses:
        '200':
          description: 분석 이력
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryRow'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          description: invalid_pagination, invalid_unchanged_filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/analyses/{id}/comparison:
    get:
      summary: 직전 성공 분석 대비 비교(P21, 명세 8). 성공한 분석만
      description: |
        기준 = 그 분석의 직전 성공 분석(no_change 분석은 기준이 아님, 첫 성공이면 baseline null = 비교 대상 없음). 건수(신규·해결·재오픈·유지·범위 밖 유지)와
        심각도별 분포, 신규·해결 각각 상위 규칙·파일 10, 변경 근거와 주의 문구 키(history.warn_tool_change, history.warn_scope_change), 결함 목록으로 갈
        필터 값(analysis+change), 이전·다음 성공 분석. 범위 밖 유지 = 그 Run에 존재한 결함 − 감지 결함(Run 요약이 없으면 null).
        해결 목록은 "이 분석에서 해결된 결함"이며 이후 재오픈된 결함도 포함(현재 상태를 함께 본다). 분석 id → 프로젝트로 접근 판정(보이지 않으면 404).
      operationId: analysisComparison
      tags: [history]
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: 비교 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AnalysisComparison'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/AnalysisNotFound'
        '409':
          description: not_succeeded(성공하지 않은 분석 — 대기·실행 중·실패·취소), analysis_unchanged(성공(변경 없음, P27) — 비교 대상이 없음, 기준 Run을 본다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/defects/{id}/timeline:
    get:
      summary: 결함 한 건의 전체 변경 이력(P21). 발생한 Run부터 지금까지, Run 흐름 순
      description: |
        발생(처음 감지한 Run), 수동 상태·담당자·심각도 변경("Run N 이후" = 그 Run이 끝난 뒤의 변경), 자동 해결·재오픈(그 분석의 Run),
        사라짐(이력 없이 존재가 끝난 구간 — 수동 resolved 뒤 미감지 등). 맨 위 summary에 존재 구간과 지금 존재 여부.
        defect_history·defect_runs만 읽는다(읽기 전용). 결함 id → 프로젝트로 접근 판정(보이지 않으면 404).
      operationId: defectTimeline
      tags: [history]
      parameters:
        - $ref: '#/components/parameters/DefectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 전체 이력
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimelineItem'
                  page:
                    $ref: '#/components/schemas/PageInfo'
                  summary:
                    type: object
                    properties:
                      first_run:
                        type: integer
                        nullable: true
                      latest_run:
                        type: integer
                        nullable: true
                      intervals:
                        type: array
                        items:
                          type: object
                          properties:
                            from:
                              type: integer
                            to:
                              type: integer
                              nullable: true
                      status:
                        type: string
                      exists_now:
                        type: boolean
                      history_count:
                        type: integer
        '400':
          description: invalid_pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DefectNotFound'
  /api/v1/projects/{id}/runs:
    get:
      summary: Run 목록(P20R). Run = 프로젝트에서 성공한 분석의 회차(1부터). 최신 Run부터
      description: |
        실패·취소·대기·실행 중 분석은 Run이 아니다. total은 그 Run에 존재한 결함 수(되채움 전에 저장된 요약이 없으면 그 분석의 감지 건수, summary_stored=false).
        changed = 직전 Run과 도구·도구 버전·설정 출처·설정 해시가 다름(changes에 항목). 헤더 X-Runs-Backfill-Needed=1이면 번호 없는 성공 분석이 있다
        (tools/backfill_runs.php). 프로젝트를 볼 수 있는 사용자 누구나. 보이지 않는 프로젝트는 404.
      operationId: listRuns
      tags: [defects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Run 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Run'
                  page:
                    $ref: '#/components/schemas/PageInfo'
                  status:
                    type: object
                    description: latest(최신 Run 번호, 없으면 null), backfill_needed, unnumbered(번호 없는 성공 분석 수)
                    properties:
                      latest:
                        type: integer
                        nullable: true
                      backfill_needed:
                        type: boolean
                      unnumbered:
                        type: integer
        '400':
          description: invalid_pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/projects/{id}/defects/bulk:
    post:
      summary: 결함 일괄 변경(담당자·심각도·상태, 명세 6.2). 결함마다 version을 검사해 항목별 결과를 돌려준다(부분 성공)
      description: |
        모든 항목이 이 프로젝트의 결함이어야 한다(다른 프로젝트·없는 id가 섞이면 아무것도 바꾸지 않고 400 defect_not_in_project).
        한 번에 ui.bulk_update_max(기본 500)건까지. 이력은 결함별·필드별로 남고, 값이 이미 같은 결함은 unchanged(이력·version 그대로).
        version이 다른 항목은 conflicts에 최신 값과 함께 담기고 바뀌지 않는다. 로그인한 사용자 누구나(관리자 제한 없음).
      operationId: bulkUpdateDefects
      tags: [defects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, changes]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, version]
                    properties:
                      id:
                        type: integer
                      version:
                        type: integer
                changes:
                  $ref: '#/components/schemas/DefectChanges'
                memo:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: 항목별 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            version:
                              type: integer
                      unchanged:
                        type: array
                        items:
                          type: integer
                      conflicts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            current:
                              $ref: '#/components/schemas/DefectDetail'
        '400':
          description: invalid_bulk, bulk_too_large, invalid_version, no_change_fields, invalid_severity, invalid_status, invalid_assignee, invalid_memo, defect_not_in_project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: csrf_invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/projects/{id}/assignees:
    get:
      summary: 담당자 후보(이 프로젝트에 접근할 수 있는 활성 사용자, admin 포함). 이메일·역할은 넣지 않는다
      operationId: listAssignees
      tags: [defects]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: q
          in: query
          description: 로그인 ID·표시 이름 부분 일치(대소문자 무시, 최대 100자)
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 후보(로그인 ID 순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        login_id:
                          type: string
                        display_name:
                          type: string
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          description: invalid_input, invalid_pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/my-defects:
    get:
      summary: 내게 지정된 결함(명세 17). 내가 담당자이고 지금 볼 수 있는 프로젝트의 결함. 상태 순(open부터) → 최근 감지 순
      operationId: listMyDefects
      tags: [defects]
      parameters:
        - name: project
          in: query
          description: 프로젝트 id(볼 수 없는 프로젝트면 0건)
          schema:
            type: integer
        - $ref: '#/components/parameters/DefectStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 결함 목록(항목마다 project {id, name})
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DefectListItem'
                  page:
                    $ref: '#/components/schemas/PageInfo'
