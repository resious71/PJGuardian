          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  # ---- 화면 설정·Node 상태 갱신(P21C, admin 전용) ----
  /api/v1/admin/settings:
    get:
      summary: 화면 설정(014 app_settings) — 키마다 value·default·min·max. 지금은 dashboard.trend_projects(대시보드 추이 프로젝트 수)
      operationId: adminSettings
      tags: [admin]
      responses:
        '200':
          description: 설정
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        value: {type: integer}
                        default: {type: integer}
                        min: {type: integer}
                        max: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      summary: "화면 설정 바꾸기(모든 사용자에게 적용). 본문은 키 → 값 객체. 감사 setting.update(key, from, to), 같은 값이면 기록 없음"
      operationId: adminUpdateSettings
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example: {dashboard.trend_projects: 8}
      responses:
        '200':
          description: 바뀐 뒤 전체 설정(GET과 같은 형식)
        '400':
          description: invalid_setting(알 수 없는 키·빈 본문), invalid_setting_value(정수 범위 밖, details min·max), invalid_json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: settings_unavailable(마이그레이션 014 전 DB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/config-settings:
    get:
      summary: "설정 관리(P27A, admin만) — 허용 목록(ConfigSchema::EDITABLE) 항목의 유효값·출처(default·config·screen·env)·기본값으로 할 때의 값·형식·범위·재시작 필요 여부, 버전 표지, 무시한 값 경고, 워커 반영 상태, 변경 이력(감사 config.update 최근 50건). 민감·제외 키는 들어 있지 않다"
      operationId: adminConfigSettings
      tags: [admin]
      responses:
        '200':
          description: 설정 관리 화면 자료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key: {type: string, example: disk.warn_percent}
                            group: {type: string, example: disk}
                            type: {type: string, enum: [int, percent, duration, size, bool, enum, path, string, list, ratio, time]}
                            value: {type: string, description: 설정 파일 표기(기간 7d 등)}
                            source: {type: string, enum: [default, config, screen, env]}
                            base:
                              type: object
                              properties:
                                value: {type: string}
                                source: {type: string, enum: [default, config]}
                            default: {type: string, nullable: true}
                            min: {type: string, nullable: true}
                            max: {type: string, nullable: true}
                            values: {type: array, nullable: true, items: {type: string}}
                            restart: {type: string, enum: [none, worker, web]}
                            machine_specific: {type: boolean}
                            env_locked: {type: boolean}
                            env_name: {type: string, example: PJG_DISK_WARN_PERCENT}
                      groups: {type: array, items: {type: string}}
                      version: {type: string, description: settings.local.ini 내용 SHA-256(없으면 빈 문자열)}
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            key: {type: string, nullable: true}
                            code: {type: string, enum: [file_unreadable, not_editable, invalid_value, cross_check, env_invalid]}
                      worker:
                        type: object
                        properties:
                          running: {type: boolean}
                          version: {type: string, nullable: true}
                          beat_at: {type: string, nullable: true}
                          pending_restart: {type: array, items: {type: string}}
                          applied: {type: boolean, nullable: true}
                      history:
                        type: array
                        items:
                          type: object
                          properties:
                            at: {type: string, format: date-time}
                            user: {type: string}
                            key: {type: string}
                            old: {type: string, nullable: true}
                            new: {type: string, nullable: true}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: "설정 바꾸기(전체 성공 또는 전체 실패). 값은 config/settings.local.ini에만(config.ini·DB는 그대로). 키마다 감사 config.update(old, new, old_source)"
      operationId: adminUpdateConfigSettings
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes, version]
              properties:
                changes: {type: object, additionalProperties: {type: string}, example: {disk.warn_percent: '75', analysis.timeout: '2h'}}
                version: {type: string, description: GET이 준 버전 표지}
                create_paths: {type: array, items: {type: string}, description: 없으면 만들어도 된다고 확인받은 경로 키}
      responses:
        '200':
          description: 저장 뒤 화면 자료(GET과 같은 형식)
        '400':
          description: invalid_config_settings(본문 형식), setting_not_editable(허용 목록 밖, details key), invalid_json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: settings_conflict(다른 관리자가 먼저 바꿈 — details version, 다시 불러오기)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: setting_invalid_value(details key·min·max), setting_cross_check(details keys), setting_env_locked(details key), setting_path_invalid(details key·code·can_create)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/config-settings/validate:
    post:
      summary: "경로 확인(저장 없음, P27A PathPolicy) — 절대·UNC·프로젝트 기준 상대 경로, 정규화(정션·링크 따라감) 후 금지 위치 비교, 존재·쓰기 시험·여유 공간, 운영 데이터와 같은 볼륨 경고. UNC는 5초 상한"
      operationId: adminValidateConfigPath
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: {type: string, description: path 형식의 허용 목록 키}
                value: {type: string}
                create: {type: boolean, description: 없으면 만든다(화면이 먼저 확인받음)}
      responses:
        '200':
          description: 검사 결과(실패도 200 — code로 구분)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code: {type: string, enum: [ok, warn_same_volume, fail_not_absolute, fail_forbidden_location, fail_not_found, fail_not_writable, fail_too_long, fail_unc_unreachable]}
                      path: {type: string, nullable: true, description: 정규화한 경로}
                      free_bytes: {type: integer, nullable: true}
                      can_create: {type: boolean}
                      created: {type: boolean}
        '400':
          description: invalid_config_settings, setting_not_editable(경로 형식 키가 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/config-settings/{key}:
    delete:
      summary: "기본값으로 — 그 키의 화면 설정을 지워 config.ini·기본값으로 되돌린다(감사 config.update). 화면 설정이 없으면 그대로 200"
      operationId: adminResetConfigSetting
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: key
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z_]+\.[a-z_]+$'}
        - name: version
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 되돌린 뒤 화면 자료(GET과 같은 형식)
        '400':
          description: invalid_config_settings(version 없음), setting_not_editable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: settings_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: setting_env_locked, setting_cross_check(되돌리면 다른 화면 설정과 규칙이 어긋남)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/backups:
    get:
      summary: "백업·복원(P27B, admin만) — 요약(마지막 성공·실패·리허설, 오래됨·리허설 기한, 다음 일일 백업, 백업 폴더·출처·경로 검사·여유, 같은 볼륨, 키 지문), 진행 중 작업, 복원 상태, 목록(최신순)"
      description: |
        목록은 백업 폴더의 묶음 파일(pjguardian-YYYYMMDD-HHMMSS-<daily|manual|pre_restore|pre_upgrade>[-n].pjgbak)과 옆 파일(<묶음>.json, manifest·검증 결과)에서 만든다.
        폴더에 직접 복사한 묶음도 나타난다(verified null). 키 값은 내보내지 않고 지문(SHA-256 앞 8자)만.
      operationId: adminBackups
      tags: [admin]
      responses:
        '200':
          description: 백업·복원 화면 자료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      dir: {type: string, description: 백업 폴더(절대 경로)}
                      dir_source: {type: string, enum: [default, config, screen, env]}
                      dir_check: {type: string, description: PathPolicy 결과 코드(ok, warn_same_volume, fail_…)}
                      dir_free_bytes: {type: integer, nullable: true}
                      inside_project: {type: boolean, description: 프로젝트 폴더 안(기본 backups/) — 같은 볼륨 경고}
                      legacy_backups_dir: {type: string, nullable: true, description: config.ini에 남은 paths.backups_dir(더 이상 쓰지 않음)}
                      last_success: {type: object, nullable: true}
                      last_failure: {type: object, nullable: true}
                      last_rehearsal: {type: object, nullable: true}
                      stale: {type: boolean}
                      rehearsal_due: {type: boolean}
                      next_daily: {type: string, format: date-time, nullable: true, description: "다음 자동 백업 예정(P27E, 꺼져 있으면 null, 최근 예정이 아직이면 지금·재시도 대기면 그 시각)"}
                      schedule:
                        type: object
                        description: 자동 백업 설정(P27E)
                        properties:
                          enabled: {type: boolean}
                          mode: {type: string, enum: [daily, weekly, monthly]}
                          at: {type: string, example: "02:30"}
                          weekly_day: {type: string, enum: [mon, tue, wed, thu, fri, sat, sun]}
                          monthly_day: {type: string, description: "1~31 또는 last"}
                          stale_hours: {type: integer, description: 주기에 맞춘 오래됨 기준(daily 설정값, weekly 8일, monthly 33일 이상)}
                          retention_min_count: {type: integer}
                          retention_max_count: {type: integer, description: 0 = 제한 없음}
                      retention_days: {type: integer}
                      job: {type: object, nullable: true, description: '{type: backup|rehearsal, kind, started, progress: {step, done, total}, cancelling}'}
                      restore: {$ref: '#/components/schemas/RestoreStatus'}
                      restore_pending: {type: boolean}
                      maintenance_stale: {type: boolean}
                      worker_running: {type: boolean}
                      key:
                        type: object
                        properties:
                          available: {type: boolean}
                          fingerprint: {type: string, nullable: true}
                      upload_max_mb: {type: integer}
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name: {type: string}
                            kind: {type: string, enum: [daily, manual, pre_restore, pre_upgrade]}
                            size: {type: integer}
                            created_at: {type: string, nullable: true}
                            app_version: {type: string, nullable: true}
                            schema_version: {type: string, nullable: true}
                            snapshots: {type: boolean, nullable: true}
                            counts: {type: object, nullable: true}
                            host: {type: string, nullable: true}
                            verified: {type: object, nullable: true, description: '{ok, code, at, ms}'}
                            uploaded: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 지금 백업(워커 작업 요청, 202). 감사 backup.create(result requested)
      operationId: adminBackupCreate
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshots: {type: boolean, default: true}
      responses:
        '202':
          description: '{data:{job}}'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/BackupError'
        '507':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backups/cancel:
    post:
      summary: 진행 중인 백업 취소 요청(취소 표지 파일, 워커가 단계 사이에서 멈추고 만들던 파일을 지움)
      operationId: adminBackupCancel
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{data:{cancelling: true}}'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/backups/rehearse:
    post:
      summary: 복원 리허설(워커 작업, 202) — 임시 폴더에 풀어 사전 검증·마이그레이션 시험·주요 조회. 운영 데이터 변경 없음
      operationId: adminBackupRehearse
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, description: 없으면 최신 묶음}
      responses:
        '202':
          description: '{data:{file}}'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BackupError'
        '409':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backups/key-export:
    post:
      summary: 암호화 키 내보내기 — 비밀번호 재입력 + 암호문구 두 번(12자 이상). 응답은 암호문구로 AES-256-GCM 암호화한 .pjgkey 내용(평문 키 없음). 감사 key.export
      operationId: adminBackupKeyExport
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, passphrase, passphrase2]
              properties:
                password: {type: string, format: password}
                passphrase: {type: string, format: password}
                passphrase2: {type: string, format: password}
      responses:
        '200':
          description: '{data:{file_name, content, fingerprint}}'
        '400':
          $ref: '#/components/responses/BackupError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BackupError'
        '429':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backups/download/{token}:
    get:
      summary: 묶음 내려받기(한 번 쓰는 표, 같은 관리자·60초 안). PHP가 스트리밍(백업 폴더는 웹이 직접 서비스하지 않음). 감사 backup.download
      operationId: adminBackupDownload
      tags: [admin]
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{48}$'}
      responses:
        '200':
          description: 묶음 파일
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backups/{name}/verify:
    post:
      summary: 묶음 다시 검증(구조·manifest·해시·DB integrity_check·건수). 웹 요청 안에서 읽기만. 감사 backup.verify
      operationId: adminBackupVerify
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/BackupName'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{data:{ok, code, params, ms}}'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backups/{name}/download:
    post:
      summary: 내려받기 표 발급 — 비밀번호 재입력(분당 5회). 응답 주소는 60초 안에 한 번
      operationId: adminBackupDownloadToken
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/BackupName'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password}
      responses:
        '200':
          description: '{data:{url}}'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BackupError'
        '404':
          $ref: '#/components/responses/BackupError'
        '429':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backups/{name}/precheck:
    post:
      summary: 복원 사전 검증·미리보기(변경 없음) — 백업·현재 건수, 이후 변경 손실(분석·결함 변경·계정), 스키마·마이그레이션, 설정 차이(민감 값 제외, PC 고유 표시), 키 상태(ok·mismatch·none), 필요한 여유
      operationId: adminBackupPrecheck
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/BackupName'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{data:{bundle, created_at, host, os, app_version, schema_version, app_schema, migrate, counts, current, loss, snapshots, snapshot_count, blanked, bin_tools, config: [{file, key, current, backup, machine}], key, size, need_mb}}'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BackupError'
        '409':
          $ref: '#/components/responses/BackupError'
        '422':
          $ref: '#/components/responses/BackupError'
        '507':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backups/{name}:
    delete:
      summary: 묶음 삭제 — 비밀번호 재입력. 마지막 성공 백업은 409. 감사 backup.delete
      operationId: adminBackupDelete
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/BackupName'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password}
      responses:
        '200':
          description: '{data:{deleted}}'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BackupError'
        '404':
          $ref: '#/components/responses/BackupError'
        '409':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/restore:
    post:
      summary: 복원 요청(202) — 비밀번호 재입력·확인 문구 "복원", 사전 검증을 다시 하고 요청 파일만 남긴다. 워커가 유지보수 모드에서 별도 프로세스로 복원(웹 요청 안에서 DB를 바꾸지 않음). 감사 restore.start(키를 가져오면 key.import)
      operationId: adminRestore
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password, confirm]
              properties:
                name: {type: string}
                password: {type: string, format: password}
                confirm: {type: string, example: 복원}
                wait_mode: {type: string, enum: [wait, cancel], default: wait}
                config_keys: {type: array, items: {type: string}, description: config.ini에 적용할 키(설정 복원을 고른 것만)}
                local_keys: {type: array, items: {type: string}, description: settings.local.ini(화면 설정)에 적용할 키}
                key:
                  type: object
                  description: 키 가져오기(.pjgkey 내용 + 암호문구). 복호화와 묶음 자격 증명 1건 시험을 통과해야 한다
                  properties:
                    content: {type: string}
                    passphrase: {type: string, format: password}
      responses:
        '202':
          description: '{data:{status_url: /restore-status}}'
        '400':
          $ref: '#/components/responses/BackupError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/BackupError'
        '404':
          $ref: '#/components/responses/BackupError'
        '409':
          $ref: '#/components/responses/BackupError'
        '422':
          $ref: '#/components/responses/BackupError'
        '429':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backup-uploads:
    post:
      summary: 묶음 올리기 시작 — 이름 규칙(.pjgbak)·크기 상한(backup.upload_max_mb)·디스크 확인. 조각 8MB
      operationId: adminBackupUploadInit
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, total_size]
              properties:
                file_name: {type: string}
                total_size: {type: integer}
      responses:
        '201':
          description: '{data:{id, file_name, total_size, chunk_size, total_chunks, received}}'
        '400':
          $ref: '#/components/responses/BackupError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/BackupError'
        '413':
          $ref: '#/components/responses/BackupError'
        '507':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backup-uploads/{id}/chunks/{index}:
    put:
      summary: 조각 하나(원시 본문, 헤더 X-Chunk-Sha256). 순서대로 이어 붙인다(재전송은 건너뜀, 순서를 건너뛰면 409)
      operationId: adminBackupUploadChunk
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/BackupUploadId'
        - name: index
          in: path
          required: true
          schema: {type: integer}
        - name: X-Chunk-Sha256
          in: header
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: '{data:{index, received, next, total_chunks}}'
        '400':
          $ref: '#/components/responses/BackupError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BackupError'
        '409':
          $ref: '#/components/responses/BackupError'
        '422':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backup-uploads/{id}/complete:
    post:
      summary: 올리기 마침 — 백업 폴더로 옮기고 "검증 필요"로 표시(검증을 통과해야 복원 가능). 감사 backup.upload
      operationId: adminBackupUploadComplete
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/BackupUploadId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{data:{name}}'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BackupError'
        '409':
          $ref: '#/components/responses/BackupError'
  /api/v1/admin/backup-uploads/{id}:
    delete:
      summary: 올리기 버리기(받은 조각 삭제)
      operationId: adminBackupUploadDiscard
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/BackupUploadId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{data:{discarded: true}}'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BackupError'
  /api/v1/restore-status:
    get:
      summary: 복원 진행 상태(P27B) — 로그인 없이·DB 없이 파일(restore_state.json·maintenance.flag)만 읽는다. 비밀·절대 경로·요청자 이름 없음(수동 복구 안내는 프로젝트 기준 상대 경로)
      operationId: restoreStatus
      tags: [meta]
      responses:
        '200':
          description: 복원 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/RestoreStatus'}
  /api/v1/admin/tools/node/refresh:
    post:
      summary: Node.js 상태 갱신 요청(워커 재시작 없음) — 워커가 설정을 다시 읽어 자기 실행 환경에서 node --version(고정 명령)을 확인한다
      description: |
        웹은 요청 파일만 쓴다(node를 실행하지 않음). 화면은 GET /api/v1/admin/tools의 node.request_at이 requested_at과 같아질 때까지 wait_seconds(10초) 기다린다.
        10초 안에 다시 요청하면 같은 요청을 돌려준다(merged=true). 본문은 무시한다(경로·인자를 받지 않음).
      operationId: adminNodeRefresh
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 요청됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      requested_at: {type: string, format: date-time}
                      merged: {type: boolean}
                      wait_seconds: {type: integer}
                      node: {type: object, nullable: true, description: 마지막 확인 결과}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: worker_not_running(워커가 멈췄거나 응답 없음 — details.worker, details.node = 마지막 확인 결과)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # ---- 대시보드(P20, 명세 9). 로그인한 모든 사용자, 집계는 보이는 프로젝트 범위만. 모든 응답에 as_of(집계 시각)와 cached ----
  /api/v1/dashboard/summary:
    get:
      summary: 현황 요약 — 보이는 프로젝트 수(분석함·분석 전·결함 0), 열린 결함(심각도별), 상태별 전체, 최근 7일 분석(성공·실패·취소), 내게 지정된 열린 결함, 마지막 분석이 실패한 프로젝트(최근 5)
      operationId: dashboardSummary
      tags: [dashboard]
      responses:
        '200':
          $ref: '#/components/responses/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/dashboard/trend:
    get:
      summary: 추이 — 프로젝트의 최근 Run(no_change 제외, ui.dashboard_trend_count건)의 결함 수·심각도별·도구 버전·변경 표식(changed, changes). project_id가 없으면 가장 최근에 분석한 보이는 프로젝트 5개
      description: |
        점(points)마다 analysis_id(호환 유지)와 run(P20R Run 번호, 되채움 전이면 null). total·by_severity는 그 Run에 존재한 결함(Run 요약, Run 목록과 같은 수)이며
        Run 요약이 없으면(되채움 전) 그 분석의 감지 건수다. project_id가 없으면 최근 분석 순으로 project_limit개(admin 설정 dashboard.trend_projects, 기본 5, P21C)이며
        language(P21C)를 주면 그 언어의 보이는 프로젝트 안에서 고른다(개수 제한은 언어 필터 뒤). 응답에 language·project_limit. detail_deleted(P21B)가 참인 점은 상세가 삭제된 Run이다(건수는 그대로, 화면은 이동 대신 안내).
      operationId: dashboardTrend
      tags: [dashboard]
      parameters:
        - $ref: '#/components/parameters/DashboardProject'
        - $ref: '#/components/parameters/DashboardLanguage'
      responses:
        '200':
          $ref: '#/components/responses/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/dashboard/top-rules:
    get:
      summary: 규칙별 상위 N(열린 결함). 전체 범위면 (도구, 규칙 키)로 합치고 프로젝트별 건수를 함께. 항목마다 결함 목록 링크(건수가 가장 많은 프로젝트, 규칙 + 열린 상태)
      operationId: dashboardTopRules
      tags: [dashboard]
      parameters:
        - $ref: '#/components/parameters/DashboardProject'
        - $ref: '#/components/parameters/DashboardLanguage'
      responses:
        '200':
          $ref: '#/components/responses/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/dashboard/top-files:
    get:
      summary: 파일별 상위 N(열린 결함). 같은 경로라도 프로젝트가 다르면 따로(프로젝트 이름 포함). 항목마다 결함 목록 링크(파일 + 열린 상태)
      operationId: dashboardTopFiles
      tags: [dashboard]
      parameters:
        - $ref: '#/components/parameters/DashboardProject'
      responses:
        '200':
          $ref: '#/components/responses/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/dashboard/tools:
    get:
      summary: 언어·도구별(Python·ruff, JS/TS·ESLint) — 프로젝트 수(분석함), 열린 결함·심각도별, 최근 성공 분석 기준 도구 버전 분포
      operationId: dashboardTools
      tags: [dashboard]
      responses:
        '200':
          $ref: '#/components/responses/Dashboard'
  /api/v1/notifications:
    get:
      summary: 내 알림 목록(P24) — 본인 알림만(admin도 같다), 최신순. 지금 볼 수 없는 프로젝트의 알림은 빠진다
      description: |
        문구는 저장하지 않는다. 화면이 kind + params로 만들고 textContent로 넣는다. params는 건수·Run 번호·상태값·실패 코드만(결함 메시지·파일 경로 없음).
        project.name은 보여 줄 때 조회한 값이다. href는 서버가 만든 이동 경로(앱 기준, 화면이 app-base를 붙인다).
      operationId: listNotifications
      tags: [notifications]
      parameters:
        - name: kind
          in: query
          schema: {type: string, enum: [analysis_done, analysis_failed, defect_assigned, defect_changed, analysis_summary]}
        - name: unread
          in: query
          description: 1이면 안 읽은 알림만
          schema: {type: string, enum: ['0', '1']}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 알림 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Notification'}
                  page: {$ref: '#/components/schemas/PageInfo'}
        '400':
          description: invalid_notification_filter(details.field = kind | unread), invalid_pagination
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: notifications_unavailable(마이그레이션 017 전 DB)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/notifications/unread-count:
    get:
      summary: 안 읽은 알림 수(헤더 배지, P24) — 인덱스만, 볼 수 없는 프로젝트의 알림 제외. 017 전 DB면 count 0, available false
      description: 화면은 탭이 보이는 동안 ui.notification_poll_seconds마다 부른다. X-PJG-Background 1을 붙이면 세션 활동으로 치지 않는다(유휴 만료 유지).
      operationId: notificationUnreadCount
      tags: [notifications]
      parameters:
        - name: X-PJG-Background
          in: header
          required: false
          schema: {type: string, enum: ['1']}
      responses:
        '200':
          description: 개수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count: {type: integer, minimum: 0}
                      available: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/notifications/{id}/read:
    post:
      summary: 읽음으로 표시(멱등 — 이미 읽었으면 처음 읽은 시각 유지)
      operationId: readNotification
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 바뀐 알림
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Notification'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          description: notification_not_found(없는 id, 다른 사용자의 알림, 볼 수 없는 프로젝트의 알림 — 구분하지 않음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/notifications/{id}/unread:
    post:
      summary: 안 읽음으로 되돌리기(멱등)
      operationId: unreadNotification
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 바뀐 알림
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Notification'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          description: notification_not_found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/notifications/read-all:
    post:
      summary: 내 모든 알림을 읽음으로(목록 화면의 필터와 무관)
      operationId: readAllNotifications
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 바꾼 수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated: {type: integer, minimum: 0}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/notifications/{id}:
    delete:
      summary: 알림 한 건 삭제(본인 것만)
      operationId: deleteNotification
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 삭제됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          description: notification_not_found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/notifications/read:
    delete:
      summary: 내 읽은 알림 모두 삭제
      operationId: deleteReadNotifications
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 지운 수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted: {type: integer, minimum: 0}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/notifications/preferences:
    get:
      summary: 내 알림 종류별 설정(기본 모두 켜짐)
      operationId: notificationPreferences
      tags: [notifications]
      responses:
        '200':
          description: 종류 → 켜짐
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/NotificationPreferences'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      summary: 내 알림 종류별 설정 바꾸기(일부만 보내도 된다). 끈 종류는 이후 만들어지지 않고, 다시 켜도 지난 알림은 생기지 않는다. 감사 로그 없음(개인 설정)
      operationId: updateNotificationPreferences
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationPreferences'}
      responses:
        '200':
          description: 바뀐 뒤 전체
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/NotificationPreferences'}
        '400':
          description: invalid_notification_pref(알 수 없는 종류, true·false가 아닌 값, 빈 본문 — details.kind)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/projects/{id}/repo:
    get:
      summary: 소스 저장소 연결 상태(P25). admin은 설정값(자격 증명 값은 없음 — secret_set만), 그 밖은 상태·출처·마지막 커밋만
      operationId: getProjectRepo
      tags: [repo]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 연결 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/RepoConnection'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    put:
      summary: 연결 저장(admin). secret을 비우면 유지, 값을 주면 교체, clear_secret=true면 삭제. 고칠 때 revision(낙관적 잠금) 필수
      operationId: saveProjectRepo
      tags: [repo]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepoConnectionInput'}
      responses:
        '200':
          description: 저장 뒤 상태(GET과 같은 형식)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/RepoConnection'}
        '400':
          description: invalid_repo_input(details.field), invalid_repo_url_scheme, repo_host_not_listed(details.host·port·http)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: repo_conflict(details.revision), repo_not_configured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: repo_secret_key_missing(암호화 키 없음 — 자격 증명 저장 거부), repo_unavailable(018 전 DB)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      summary: 연결 해제(admin) — 업로드 전용으로. 쌓인 분석의 출처 기록은 남는다
      operationId: deleteProjectRepo
      tags: [repo]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 해제됨
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/projects/{id}/repo/test:
    post:
      summary: 연결 테스트(admin, 읽기만 — Git ls-remote, Perforce changes). 웹 요청 안에서 repository.test_timeout(30초)까지, 사용자당 분당 repository.test_per_minute회
      description: 본문 {draft} 없으면 저장된 연결, 있으면 저장 전 입력(secret을 비우면 저장된 값 사용). 결과는 200 + ok·code(분석 실패 코드와 같은 이름), Perforce SSL은 서버 지문.
      operationId: testProjectRepo
      tags: [repo]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                draft: {$ref: '#/components/schemas/RepoConnectionInput'}
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok: {type: boolean}
                      code: {type: string, nullable: true}
                      branch: {type: string}
                      commit: {type: string}
                      change: {type: integer}
                      fingerprint: {type: string}
                      seconds: {type: number}
        '400':
          description: invalid_repo_input(details.field), invalid_repo_url_scheme, repo_host_not_listed(details.host·port·http)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: repo_conflict(details.revision), repo_not_configured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: repo_test_rate_limited(details n)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/projects/{id}/repo/fetch:
    post:
      summary: 지금 가져와 분석(admin) — 분석 행(queued, 출처 git|perforce, 실행 주체 user, 요청자 = 누른 admin)만 만든다. git·p4는 워커가 실행
      description: |
        P27: 웹 요청은 원격을 호출하지 않는다. 워커가 분석을 집은 직후(가져오기 전) 원격 최신 리비전·연결·분석 조건을 직전 성공 분석과 비교해
        같으면 그 행을 성공(변경 없음, unchanged = true)으로 마감한다(가져오기·도구·결함·Run·알림 없음). 화면은 분석을 지켜보다가 변경 없음이면
        "변경이 없습니다. 그래도 분석할까요?"를 묻고, 확인하면 force = true로 다시 요청한다(판단을 건너뛴 일반 분석, 감사 repo.fetch_now에 force: true).
      operationId: fetchProjectRepo
      tags: [repo]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: {type: boolean, default: false, description: 'P27 강제 분석(admin 전용 라우트). 변경 없음 판단을 건너뛴다'}
      responses:
        '202':
          description: 대기열 등록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      analysis_id: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '400':
          description: invalid_repo_input(details.field = force — 불리언이 아님)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: repo_not_configured, repo_secret_unreadable, analysis_in_progress(대기·실행 중 분석 있음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '507':
          description: insufficient_storage·disk_usage_blocked(해제 상한 × 2 사전 검사)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/projects/{id}/schedule:
    get:
      summary: 주기 분석 설정(admin, P26) — 사용 여부·간격·실행 시각(KST)·다음 실행·마지막 결과·연속 실패·건너뜀·켜기 조건·같은 시각 예약 수
      description: 일반 사용자는 GET /api/v1/projects/{id}/repo의 schedule 요약(사용 중 여부·다음 예정)만 본다. 보이지 않는 프로젝트는 404(접근 검사가 권한 검사보다 먼저).
      operationId: getProjectSchedule
      tags: [schedule]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 주기 설정
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ProjectSchedule'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '503':
          description: schedule_unavailable(DB 마이그레이션 019 전)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      summary: 주기 분석 설정 저장(admin, P26) — 켜거나 간격·시각을 바꾸면 다음 실행 = 바꾼 시점 이후 가장 가까운 지정 시각
      operationId: saveProjectSchedule
      tags: [schedule]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectScheduleInput'}
      responses:
        '200':
          description: 저장 뒤 설정(+ warnings — connection_error·connection_unchecked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ProjectSchedule'}
        '400':
          description: invalid_schedule_input(details.field = enabled·interval_days·run_time·body)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: schedule_conflict(details.revision), schedule_connection_required(details.reason = repo_not_configured·repo_host_not_allowed·repo_secret_unreadable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: schedule_unavailable(DB 마이그레이션 019 전)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/schedules:
    get:
      summary: 주기 분석 현황(admin, P26) — 스케줄러 상태(마지막 확인·지연), 프로젝트별 일정, 최근 실패(재시도 대기 포함·다음 주기 재수행 예정), 최근 건너뜀
      operationId: getScheduleOverview
      tags: [schedule]
      responses:
        '200':
          description: 현황
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scheduler:
                        type: object
                        properties:
                          last_tick_at: {type: string, nullable: true}
                          delayed: {type: boolean, description: 워커가 도는데 마지막 확인이 tick_seconds × 5보다 오래됨}
                          worker_running: {type: boolean}
                          tick_seconds: {type: integer}
                          last: {type: object, nullable: true}
                      schedules: {type: array, items: {type: object}}
                      failures: {type: array, items: {type: object}}
                      skips: {type: array, items: {type: object}}
                      failure_days: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: schedule_unavailable(DB 마이그레이션 019 전)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/repo-hosts:
    get:
      summary: 허용 호스트 목록(admin, 화면은 설정 관리 > 저장소 연결 — X12)
      operationId: listRepoHosts
      tags: [repo]
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RepoHost'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 허용 호스트 추가(admin, 감사 repo_host.add). 호스트는 소문자·후행 점 없음으로 정규화, port 0 = 모든 포트
      operationId: addRepoHost
      tags: [repo]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepoHostInput'}
      responses:
        '201':
          description: 추가됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/RepoHost'}
        '400':
          description: invalid_repo_input(details.field), invalid_repo_url_scheme, repo_host_not_listed(details.host·port·http)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: repo_host_exists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/repo-hosts/{id}/test:
    post:
      summary: 허용 호스트 연결 테스트(admin, P26B) — 등록된 호스트만, 저장소·자격 증명 없이 이름 풀이·허용 판정·TCP·TLS(만료일·발급자·이름 일치·신뢰)·HTTP 상태 줄
      description: 금지 주소로 풀리면 접속하지 않는다. 판정한 주소로 고정, 리다이렉트를 따라가지 않고 응답 본문을 읽지 않는다. 분당 횟수는 저장소 연결 테스트와 공유(repository.test_per_minute).
      operationId: testRepoHost
      tags: [repo]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 단계별 결과와 저장 뒤 행
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/RepoHostTest'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: repo_host_not_found(등록되지 않은 호스트 id)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: repo_test_rate_limited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/repo-hosts/test-all:
    post:
      summary: 허용 호스트 전체 연결 테스트(admin, P26B) — 등록 순서(호스트·포트)로 최대 repository.host_test_max개, 분당 횟수는 1회로 센다
      operationId: testAllRepoHosts
      tags: [repo]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 결과 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results: {type: array, items: {$ref: '#/components/schemas/RepoHostTest'}}
                      total: {type: integer}
                      tested: {type: integer}
                      truncated: {type: integer, description: 상한 때문에 테스트하지 않은 호스트 수}
                      max: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: repo_host_none(등록된 호스트 없음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: repo_test_rate_limited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/repo-hosts/{id}:
    patch:
      summary: 허용 호스트 고치기(admin) — allow_http·github_links·note만(호스트·포트는 지우고 다시 추가)
      operationId: updateRepoHost
      tags: [repo]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepoHostInput'}
      responses:
        '200':
          description: 고친 뒤
        '400':
          description: invalid_repo_input(details.field), invalid_repo_url_scheme, repo_host_not_listed(details.host·port·http)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: repo_host_not_found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      summary: 허용 호스트 지우기(admin)
      operationId: deleteRepoHost
      tags: [repo]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 지움
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: repo_host_not_found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  headers:
    X-Request-Id:
      description: 요청 ID(로그와 연결)
      schema:
        type: string
        example: 3f9c2a7d1b4e8a60
  schemas:
    AuditLogEntry:
      type: object
      description: >-
        감사 로그 한 행(P30) + 사람이 읽는 설명(X17 AuditDescriber — 저장된 행은 그대로, 보여 줄 때 현재 화면 언어로 만든다). 목록에는 details(원본)가 없고
        한 행 응답에만 details·prev_hash·hash가 있다. 가린 값은 풀지 않는다(비밀번호·토큰·키·평문 이메일·40자 이상 덩어리는 문장·표에 없음)
      properties:
        id: {type: integer}
        occurred_at: {type: string, format: date-time}
        actor: {type: string, description: 기록된 행위자 이름표(로그인 ID·system·cli·restore:<id>·login@<ip>)}
        actor_user_id: {type: integer, nullable: true}
        action: {type: string, description: 작업 이름(docs/audit_actions.md)}
        target_type: {type: string, nullable: true}
        target_id: {type: string, nullable: true}
        ip: {type: string, nullable: true}
        result: {type: string, nullable: true}
        request_id: {type: string, nullable: true}
        details_brief: {type: string, description: 세부 정보 원본 한 줄(키=값 몇 개, 기술용)}
        summary: {type: string, description: '한 문장 요약(예 "관리자 alex가 사용자 Jordan Lee (jordan)의 역할을 일반 사용자 → 관리자로 바꿨습니다.")'}
        known: {type: boolean, description: 설명 문구가 있는 작업인가(false = 일반 문장, 화면 "설명 없음(원본만)")}
        action_label: {type: string}
        action_group: {type: string}
        actor_display: {type: string}
        actor_name: {type: string, nullable: true, description: 행위자 사용자의 표시 이름(있을 때)}
        source: {type: string, enum: [web, cli, login, system]}
        source_label: {type: string}
        target_label: {type: string, description: '대상 이름(사용자·프로젝트·그룹·FAQ는 일괄 조회로 풀이, 못 찾으면 기록된 이름 또는 "삭제된 항목(#id)")'}
        target_href: {type: string, nullable: true, description: 대상 화면 경로(앱 기준 경로, 삭제된 대상은 null)}
        target_deleted: {type: boolean}
        outcome: {type: string, enum: [success, failure, requested]}
        outcome_label: {type: string}
        outcome_reason: {type: string, nullable: true, description: 실패 사유 풀이(문구가 없으면 코드)}
        outcome_code: {type: string, nullable: true}
        outcome_href: {type: string, nullable: true, description: 가이드 오류 코드 탭 링크(있는 코드만)}
        fields:
          type: array
          description: 항목별 풀이(바뀐 항목은 changed=true·before/after, 나머지는 after만)
          items:
            type: object
            properties:
              key: {type: string}
              label: {type: string}
              before: {type: string, nullable: true}
              after: {type: string}
              changed: {type: boolean}
        details: {type: object, additionalProperties: true, description: 한 행 응답에만 — 화면 단계 마스킹을 거친 원본}
        prev_hash: {type: string, description: 한 행 응답에만}
        hash: {type: string, description: 한 행 응답에만}
    HealthStatus:
      type: object
      required: [status, time, maintenance, checks]
      properties:
        status: {type: string, enum: [ok, warn, fail]}
        time: {type: string, format: date-time}
        maintenance: {type: boolean, description: 'P32B 업그레이드 유지보수 모드(maintenance.enabled) — 판정(status)에는 넣지 않음'}
        checks:
          type: object
          required: [worker, db, disk, backup, queue]
          properties:
            worker:
              type: object
              properties:
                alive: {type: boolean}
                last_seen: {type: string, format: date-time, nullable: true}
            db:
              type: object
              properties:
                ok: {type: boolean}
            disk:
              type: object
              properties:
                used_percent: {type: number, nullable: true}
                state: {type: string, enum: [ok, warn, block, unknown]}
            backup:
              type: object
              properties:
                last_success_at: {type: string, format: date-time, nullable: true}
                state: {type: string, enum: [ok, stale, failed, unknown]}
            queue:
              type: object
              properties:
                waiting: {type: integer}
                oldest_wait_seconds: {type: integer, nullable: true}
                stalled: {type: boolean}
    RestoreStatus:
      type: object
      description: 복원 진행 상태(P27B, restore_state.json의 공개 부분 — 비밀·절대 경로·요청자 없음)
      properties:
        maintenance: {type: boolean}
        maintenance_since: {type: string, nullable: true}
        status: {type: string, nullable: true, enum: [requested, running, succeeded, failed, rolled_back, rollback_failed, null]}
        bundle: {type: string, nullable: true}
        started_at: {type: string, nullable: true}
        finished_at: {type: string, nullable: true}
        step: {type: string, nullable: true}
        steps:
          type: array
          items:
            type: object
            properties:
              name: {type: string, enum: [precheck, maintenance, pre_restore_backup, replace_db, replace_snapshots, migrate, finalize]}
              status: {type: string, enum: [running, done, skipped, failed]}
              at: {type: string, nullable: true}
        error:
          type: object
          nullable: true
          properties:
            code: {type: string}
            params: {type: object}
        result:
          type: object
          description: counts, migrated, sessions_cleared, config_applied, key_imported, credentials_unreadable, from_schema, pre_restore_backup
        manual:
          type: array
          description: 되돌리기도 실패했을 때 수동 복구 절차(프로젝트 기준 상대 경로)
          items:
            type: object
            properties:
              move: {type: string}
              to: {type: string}
    ProjectSchedule:
      type: object
      description: 프로젝트 주기 분석 설정과 요약(P26). 시각은 UTC ISO, 실행 시각 run_time은 KST HH:MM
      properties:
        enabled: {type: boolean}
        interval_days: {type: integer, minimum: 1, maximum: 365}
        run_time: {type: string, example: '03:00'}
        next_run_at: {type: string, nullable: true}
        last_due_at: {type: string, nullable: true}
        last_analysis_id: {type: integer, nullable: true}
        last_result: {type: string, nullable: true, enum: [succeeded, failed, cancelled]}
        last_result_at: {type: string, nullable: true}
        consecutive_failures: {type: integer}
        last_error_code: {type: string, nullable: true}
        last_error_title: {type: string, nullable: true}
        last_error_at: {type: string, nullable: true}
        skip_count: {type: integer}
        last_skip_reason: {type: string, nullable: true}
        last_skip_at: {type: string, nullable: true}
        revision: {type: integer, nullable: true}
        blocker: {type: string, nullable: true, enum: [repo_not_configured, repo_host_not_allowed, repo_secret_unreadable], description: 켤 수 없는 이유}
        connection_status: {type: string, nullable: true, enum: [ok, error, unknown]}
        time_counts: {type: object, additionalProperties: {type: integer}, description: 다른 프로젝트의 실행 시각별 예약 수}
        recommended_days: {type: integer}
        min_days: {type: integer}
        max_days: {type: integer}
        warnings: {type: array, items: {type: string, enum: [connection_error, connection_unchecked]}, description: 저장(PUT) 응답에만}
    ProjectScheduleInput:
      type: object
      required: [enabled, interval_days, run_time]
      properties:
        enabled: {type: boolean}
        interval_days: {type: integer, minimum: 1, maximum: 365}
        run_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        revision: {type: integer, description: 이미 설정이 있으면 필수(다르면 409 schedule_conflict)}
    RepoConnection:
      type: object
      description: 저장소 연결 상태(P25). 자격 증명 값은 어떤 응답에도 없다
      properties:
        configured: {type: boolean}
        kind: {type: string, enum: [none, git, perforce]}
        status: {type: string, nullable: true, enum: [ok, error, unknown]}
        last_fetch_at: {type: string, nullable: true}
        last_analyzed:
          type: object
          nullable: true
          properties:
            analysis_id: {type: integer}
            kind: {type: string}
            ref: {type: string, nullable: true}
            revision: {type: string, nullable: true}
            fetched_at: {type: string, nullable: true}
            run: {type: integer, nullable: true}
          description: 마지막으로 실제로 가져와 분석한 성공(성공(변경 없음)은 제외, P27)
        last_check:
          type: object
          nullable: true
          description: 'P27 마지막 확인: 가져오지 않고 원격 리비전만 본 시각·결과(unchanged = 변경 없음으로 생략, changed = 분석, error = 조회 실패). 연결을 바꾸면 지운다'
          properties:
            at: {type: string, format: date-time}
            result: {type: string, nullable: true, enum: [unchanged, changed, error, null]}
            revision: {type: string, nullable: true}
        next_run_at: {type: string, nullable: true, description: P26(주기 분석)이 채운다}
        label: {type: string, nullable: true, description: 'Git 호스트/경로 @브랜치(사용자 정보 없음), Perforce depot 경로'}
        location: {type: string, description: admin만}
        branch: {type: string, nullable: true, description: admin만}
        path: {type: string, nullable: true, description: admin만}
        username: {type: string, nullable: true, description: admin만}
        secret_set: {type: boolean, description: admin만}
        secret_kind: {type: string, nullable: true, enum: [token, password, ticket]}
        secret_readable: {type: boolean}
        fingerprint: {type: string, nullable: true}
        fetch_timeout: {type: integer, nullable: true}
        plaintext_warning: {type: boolean}
        host_allowed: {type: boolean}
        test: {type: object}
        fetch: {type: object}
        revision: {type: integer}
        key_available: {type: boolean, nullable: true}
    RepoConnectionInput:
      type: object
      properties:
        kind: {type: string, enum: [git, perforce]}
        url: {type: string, description: 'Git — https:// 또는 http://(허용 목록에 HTTP로 등록된 호스트만), 사용자 정보·쿼리 금지'}
        branch: {type: string, nullable: true}
        path: {type: string, nullable: true, description: Git 하위 경로 또는 Perforce depot 경로(//depot/a/...)}
        port: {type: string, description: 'Perforce P4PORT — ssl:host:port 또는 host:port(tcp:·tcp4: 허용)'}
        username: {type: string, nullable: true}
        secret: {type: string, description: 토큰·비밀번호·티켓(비우면 유지)}
        secret_kind: {type: string, enum: [password, ticket]}
        clear_secret: {type: boolean}
        fingerprint: {type: string, nullable: true}
        fetch_timeout: {type: integer, nullable: true, minimum: 60, maximum: 86400}
        revision: {type: integer}
    RepoHost:
      type: object
      properties:
        id: {type: integer}
        host: {type: string}
        port: {type: integer}
        allow_http: {type: boolean}
        github_links: {type: boolean}
        note: {type: string}
        created_at: {type: string}
        updated_at: {type: string}
        last_test:
          type: object
          nullable: true
          description: P26B 마지막 호스트 연결 테스트(프로젝트 연결 상태와 별개)
          properties:
            at: {type: string}
            code: {type: string, enum: [ok, warn_cert_expiring, fail_dns, fail_blocked_address, fail_connect, fail_tls_untrusted, fail_tls_expired, fail_tls_name_mismatch, fail_http_status]}
            ms: {type: integer, nullable: true}
        cert:
          type: object
          nullable: true
          properties:
            not_after: {type: string}
            issuer: {type: string, nullable: true}
            days_left: {type: integer}
            expired: {type: boolean}
            expiring: {type: boolean, description: notification.cert_expiry_warn(30일) 안}
    RepoHostTest:
      type: object
      description: 호스트 연결 테스트 결과(P26B)
      properties:
        host: {$ref: '#/components/schemas/RepoHost'}
        code: {type: string}
        ms: {type: integer}
        dns:
          type: object
          properties:
            ok: {type: boolean}
            ips: {type: array, items: {type: object, properties: {ip: {type: string}, class: {type: string, enum: [public, private, loopback, blocked]}}}}
            reason: {type: string, nullable: true, enum: [dns, address]}
            pinned: {type: string, nullable: true}
        targets:
          type: array
          description: 포트별(0이면 443과 HTTP 허용 시 80) TCP·TLS·HTTP 결과
          items: {type: object}
        cert:
          type: object
          nullable: true
          description: not_after, days_left, issuer, subject, names, name_match, expired, expiring, fingerprint_sha256(인증서), key_sha1·key_sha256(공개 키 — Perforce 지문 확인용)
    RepoHostInput:
      type: object
      properties:
        host: {type: string}
        port: {type: integer, minimum: 0, maximum: 65535}
        allow_http: {type: boolean}
        github_links: {type: boolean}
        note: {type: string, maxLength: 200}
    Notification:
      type: object
      description: 앱 안 알림 한 건(P24). 문구는 화면이 kind + params로 만든다
      required: [id, kind, params, created_at, read_at, project, href]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [analysis_done, analysis_failed, defect_assigned, defect_changed, analysis_summary]}
        params:
          type: object
          description: |
            analysis_done {run, total, new, resolved, reopened, no_change} · analysis_failed {status: failed|cancelled, code} ·
            defect_assigned {count} · defect_changed {count, status, severity(바뀐 새 값, 여러 값이면 null)} ·
            analysis_summary {run, new, resolved, reopened, mine_resolved, mine_reopened}
        created_at: {type: string, format: date-time}
        read_at: {type: string, format: date-time, nullable: true}
        project:
          type: object
          nullable: true
          properties:
            id: {type: integer}
            name: {type: string}
        analysis_id: {type: integer, nullable: true}
        defect_id: {type: integer, nullable: true, description: 한 건일 때만(일괄은 null)}
        href: {type: string, nullable: true, description: '이동 경로(앱 기준). 예: /projects/1?run=3, /analyses/9, /defects/5, /my-defects'}
        failure:
          type: object
          description: analysis_failed의 실패 코드 제목·가이드 키(ErrorCatalog)
          properties:
            title: {type: string}
            guide_key: {type: string, nullable: true}
    NotificationPreferences:
      type: object
      description: 종류 → 켜짐(기본 true)
      properties:
        analysis_done: {type: boolean}
        analysis_failed: {type: boolean}
        defect_assigned: {type: boolean}
        defect_changed: {type: boolean}
        analysis_summary: {type: boolean}
    Analysis:
      type: object
      properties:
        id:
          type: integer
        run:
          type: integer
          nullable: true
          description: Run 번호(P20R). 성공한 분석만, 실패·취소·대기·실행 중·되채움 전은 null
        project_id:
          type: integer
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        queue_position:
          type: integer
          nullable: true
          description: 대기 순번(1부터, queued만). 앞에 대기 중인 작업 수 + 1. 프로젝트당 1개 규칙의 건너뛰기 때문에 실제 시작 순서와 다를 수 있다
        cancel_requested:
          type: boolean
        source_kind:
          type: string
          enum: [upload, git, perforce]
        source_ref:
          type: string
          nullable: true
        source_revision:
          type: string
          nullable: true
        trigger_kind:
          type: string
          enum: [user, schedule]
        source_warnings:
          type: array
          description: P26B 저장소 가져오기 경고 — [{code symlinks_skipped, count, paths(처음 20개)}]. 업로드 분석은 빈 배열
          items: {type: object}
        retry:
          type: object
          nullable: true
          description: P26 주기 분석 가져오기 재시도 — 재시도 대기(queued)면 next_attempt·after, 최종 실패면 attempts(시도 횟수)
          properties:
            attempts: {type: integer}
            next_attempt: {type: integer, nullable: true}
            after: {type: string, nullable: true}
            code: {type: string, nullable: true}
            title: {type: string, nullable: true}
        requested_by:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            login_id:
              type: string
            display_name:
              type: string
        tool:
          type: string
          enum: [ruff, eslint]
        tool_version:
          type: string
          nullable: true
        upload_id:
          type: string
          nullable: true
        queued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        failure_code:
          type: string
          nullable: true
          description: timeout, output_limit, worker_crashed, worker_stopped, analysis_crashed, analysis_start_failed, tool_failed 등
        failure_message:
          type: string
          nullable: true
          description: 사용자 문구(화면은 텍스트로만 표시)
        counts:
          type: object
          nullable: true
          description: 성공한 분석의 결함 통계(P16이 채운다)
          properties:
            total:
              type: integer
            new:
              type: integer
            resolved:
              type: integer
            reopened:
              type: integer
            unchanged:
              type: integer
        failure:
          allOf:
            - $ref: '#/components/schemas/FailureInfo'
          nullable: true
          description: 실패 코드의 제목·원인·조치·가이드 키(P19, ErrorCatalog). 성공·진행 중이면 null
        severity_counts:
          type: object
          nullable: true
          additionalProperties:
            type: integer
          description: 이번 분석에서 감지된 결함의 심각도별 건수(성공만)
        baseline:
          type: object
          nullable: true
          description: 비교 대상(직전 성공 분석, 명세 8)
          properties:
            id:
              type: integer
            finished_at:
              type: string
              format: date-time
              nullable: true
        first_analysis:
          type: boolean
          description: 성공했고 비교 대상이 없음("비교 대상 없음", 모든 결함이 신규)
        unchanged:
          type: boolean
          description: 'P27 성공(변경 없음): 원격 최신 리비전·연결·분석 조건이 직전 성공 분석과 같아 분석을 생략(status는 succeeded 그대로, Run·통계 없음)'
        unchanged_check_count:
          type: integer
          nullable: true
          description: 같은 리비전을 연속으로 확인한 횟수(주기 분석은 새 행 대신 이 값을 올린다). 변경 없음이 아니면 null
        unchanged_last_checked_at:
          type: string
          format: date-time
          nullable: true
        unchanged_base:
          type: object
          nullable: true
          description: 그 리비전을 실제로 분석한 성공 분석(비교 기준)
          properties:
            analysis_id: {type: integer}
            run: {type: integer, nullable: true}
            finished_at: {type: string, format: date-time, nullable: true}
        force_analysis:
          type: boolean
          description: 'P27: admin이 변경 없음 확인 뒤 "그래도 분석"으로 만든 분석'
        duration_seconds:
          type: integer
          nullable: true
        config_source:
          type: string
          nullable: true
          enum: [upload, server_default, null]
        ignored_configs:
          type: array
          description: 무시·변환한 설정(명세 5.3 "설정 무시됨")
          items:
            type: object
            properties:
              file:
                type: string
              reason:
                type: string
                enum: [eslint_config_ignored, ruff_nested_config, ruff_config_rejected, eslintignore_converted]
              detail:
                type: string
              count:
                type: integer
        upload:
          type: object
          nullable: true
          properties:
            file_name:
              type: string
            warnings:
              type: array
              items:
                type: string
              description: 사용자가 확인하고 진행한 업로드 경고(no_target, top_folder_missing, top_folder_kept)
            confirmed_at:
              type: string
              format: date-time
              nullable: true
        can_cancel:
          type: boolean
          description: 이 사용자에게 취소 버튼을 보일지(queued·running, 요청자 본인 또는 admin). 서버가 취소 때 다시 검사한다
    FailureInfo:
      type: object
      description: 업로드 오류·분석 실패 설명(P19, docs/error_codes.md)
      properties:
        code:
          type: string
        known:
          type: boolean
        title:
          type: string
        cause:
          type: string
        action:
          type: string
        guide_key:
          type: string
          nullable: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: snake_case 오류 코드
              example: not_found
            message:
              type: string
              description: 사용자에게 보여 줄 한국어 메시지
              example: 요청한 경로를 찾을 수 없습니다.
            request_id:
              type: string
              nullable: true
              example: 3f9c2a7d1b4e8a60
            details:
              type: object
              description: '일부 오류에만 있는 공개 값(P18 version_conflict는 {"current": 최신 결함}). 내부 경로·예외 메시지는 넣지 않는다'
    DefectChanges:
      type: object
      description: 바꿀 필드만(하나 이상)
      properties:
        assignee_id:
          type: integer
          nullable: true
          description: 담당자 사용자 id(null = 해제). 이 프로젝트에 접근할 수 있는 활성 사용자만
        severity:
          type: string
          enum: [critical, high, medium, low, not_defined]
        status:
          type: string
          enum: [open, in_progress, postponed, intentional, not_fix, resolved]
    DefectUser:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        login_id:
          type: string
        display_name:
          type: string
        active:
          type: boolean
          description: false면 비활성 사용자(명세 6.2 비활성 표시)
        has_access:
          type: boolean
          nullable: true
          description: 담당자가 이 결함의 프로젝트에 접근할 수 있는지(false면 "접근 권한 없음" 표시, 알림 대상 제외, P18). 결함의 담당자에만 있다
    Defect:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        tool:
          type: string
          enum: [ruff, eslint]
        language:
          type: string
          enum: [python, javascript, typescript]
        rule_key:
          type: string
        rule_url:
          type: string
          nullable: true
          description: 규칙 설명 페이지 경로(/rules/<도구>/<규칙>). 규칙 설명 페이지(P22) 전에는 항상 null
        file_path:
          type: string
        line:
          type: integer
        column:
          type: integer
          nullable: true
        end_line:
          type: integer
          nullable: true
        end_column:
          type: integer
          nullable: true
        message:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, not_defined]
        severity_source:
          type: string
          enum: [none, auto, manual]
          description: 심각도 출처(P21S) — auto = 규칙 기본 심각도가 부여, manual = 사람이 바꿈(이후 분석·일괄 채움이 바꾸지 않음), none = 부여된 적 없음. 과거 Run 보기에서는 그 시점 값
        status:
          type: string
          enum: [open, in_progress, postponed, intentional, not_fix, resolved]
        assignee:
          $ref: '#/components/schemas/DefectUser'
        version:
          type: integer
          description: 낙관적 잠금 값(수정 P18에서 함께 보낸다)
        last_seen:
          type: object
          properties:
            analysis_id:
              type: integer
            finished_at:
              type: string
              format: date-time
              nullable: true
    DefectListItem:
      description: 결함 목록·내 결함의 행(P21U에서 결함 표 "Run"·"최근 감지" 열 값 추가)
      allOf:
        - $ref: '#/components/schemas/Defect'
        - type: object
