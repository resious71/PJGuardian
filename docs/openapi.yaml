              type: string
              format: date-time
              nullable: true
              description: 그 분석의 종료 시각(UTC). 화면 표는 날짜만(yy-mm-dd, 표시 시간대), 전체 일시는 툴팁. 한정되면 Run N 분석의 종료 시각
