          type: string
          format: date-time
    GroupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 앞뒤 공백 제거, 제어 문자 불가, 대소문자 무시 고유
        description:
          type: string
          maxLength: 2000
    GroupData:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Group'
    GroupMember:
      type: object
      properties:
        user_id:
          type: integer
        login_id:
          type: string
        display_name:
          type: string
        is_manager:
          type: boolean
        active:
          type: boolean
        added_at:
          type: string
          format: date-time
    ProjectAccessData:
      type: object
      properties:
        data:
          type: object
          properties:
            groups:
              type: array
              items:
                type: object
                properties:
                  group_id:
                    type: integer
                  name:
                    type: string
                  member_count:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
            users:
              type: array
              items:
                type: object
                properties:
                  user_id:
                    type: integer
                  login_id:
                    type: string
                  display_name:
                    type: string
                  active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
            viewer_count:
              type: integer
              description: 관리자를 뺀, 볼 수 있는 활성 사용자 수(직접 + 그룹, 중복 제거)
    AdminToolVersion:
      type: object
      description: 도구 버전 하나(P20A). 서버 경로는 없다
      properties:
        tool: {type: string}
        version: {type: string}
        os: {type: string, enum: [windows, linux]}
        on_disk: {type: boolean}
        status: {type: string, enum: [active, pinned, blocked, invalid, new]}
        checksum_ok: {type: integer, nullable: true}
        smoke_ok: {type: integer, nullable: true}
        smoke_message: {type: string, nullable: true}
        last_check_at: {type: string, nullable: true}
        last_check_method: {type: string, nullable: true, enum: [full, fingerprint]}
        problems: {type: array, items: {type: string}, description: 체크섬 불일치 파일(상대 경로) 등}
        fingerprint_changed: {type: boolean}
        supported: {type: boolean}
        removal_requested_at: {type: string, nullable: true}
        removed_at: {type: string, nullable: true}
        selected: {type: boolean}
        unused: {type: boolean, description: 디스크에 있지만 지금 선택되지 않는 버전(구버전 정리 안내)}
        verify_task: {type: object, nullable: true}
        remove_command: {type: string, nullable: true}
    AdminRun:
      type: object
      description: Run 관리 표의 행(P21B)
      properties:
        run:
          type: integer
        analysis_id:
          type: integer
        finished_at:
          type: string
          format: date-time
        open:
          type: integer
          nullable: true
        new:
          type: integer
        resolved:
          type: integer
        reopened:
          type: integer
        tool_name:
          type: string
        tool_version:
          type: string
          nullable: true
        latest:
          type: boolean
          description: 최신 Run(삭제할 수 없음)
        detail_deleted:
          type: object
          nullable: true
          properties:
            at:
              type: string
              format: date-time
            reason:
              type: string
              enum: [manual, retention]
            by:
              type: integer
              nullable: true
              description: 삭제한 사용자 id(자동 보관이면 null = system)
            by_name:
              type: string
              nullable: true
    AdminToolsData:
      type: object
      properties:
        data:
          type: object
          properties:
            tools:
              type: array
              items:
                type: object
                properties:
                  tool: {type: string}
                  os: {type: string}
                  selection: {type: object}
                  versions: {type: array, items: {$ref: '#/components/schemas/AdminToolVersion'}}
            node:
              type: object
              nullable: true
              description: >-
                워커가 확인한 Node.js(경로는 넣지 않음): ok, version, reason(node_not_found·node_not_runnable·node_timeout·node_too_old), min, source(config|path),
                checked_at, request_at("상태 갱신" 요청 시각, P21C), config_error(설정 파일을 다시 읽지 못함)
    AdminStaging:
      type: object
      properties:
        id: {type: string}
        tool: {type: string, enum: [ruff, eslint]}
        file_name: {type: string}
        total_size: {type: integer}
        received_bytes: {type: integer}
        chunk_size: {type: integer}
        total_chunks: {type: integer}
        next_chunk: {type: integer}
        status: {type: string, enum: [receiving, staged, installing, installed, install_failed, discarded]}
        sha256: {type: string, nullable: true}
        expected_sha256: {type: string, nullable: true}
        hash_match: {type: boolean, nullable: true}
        install_command: {type: string, nullable: true, description: 'php tools/tools_ctl.php install --staging=<id> (해시 불일치·받는 중이면 null)'}
        result: {type: object, nullable: true}
    AdminTask:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string, enum: [tool_verify, cleanup_run, disk_scan]}
        target: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        result: {type: object, nullable: true}
  parameters:
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    UploadId:
      name: id
      in: path
      required: true
      description: 서버가 만든 32자리 16진수. 형식이 틀리면 없는 업로드와 같은 404
      schema:
        type: string
    AnalysisId:
      name: id
      in: path
      required: true
      description: 분석 id(정수). 형식이 틀리면 없는 분석과 같은 404
      schema:
        type: integer
    DefectId:
      name: id
      in: path
      required: true
      description: 결함 id(정수). 형식이 틀리면 없는 결함과 같은 404
      schema:
        type: integer
    DefectFromRun:
      name: from_run
      in: query
      description: Run N에서 새로 생긴 결함(처음 감지가 Run N, P21). 1 이상 정수(그 밖 400 invalid_defect_filter)
      schema:
        type: integer
        minimum: 1
    DefectInRunFrom:
      name: in_run_from
      in: query
      description: Run N~M에 존재(존재 구간이 범위와 겹침 = 그 사이 Run 중 한 번이라도 존재, P21). 한쪽만 주면 그 Run 하나. from > to면 400
      schema:
        type: integer
        minimum: 1
    DefectInRunTo:
      name: in_run_to
      in: query
      description: Run N~M에 존재의 M(in_run_from 참고)
      schema:
        type: integer
        minimum: 1
    DefectRun:
      name: run
      in: query
      description: |
        Run 번호(P20R). 생략하거나 최신 Run이면 현재 결함 표(기존 동작). 과거 Run이면 그 Run에 존재한 결함만, 상태·담당자·심각도는 그 Run 종료 시점 값(이력으로 복원,
        읽기 전용). 위치·메시지는 최신 감지 값. 형식이 틀리면 422 invalid_run, 없는 Run은 404 run_not_found
      schema:
        type: integer
        minimum: 1
    DefectRule:
      name: rule
      in: query
      description: 규칙 키, 쉼표 구분(예 ruff:F401,syntax-error). 최대 50개
      schema:
        type: string
    DefectSeverity:
      name: severity
      in: query
      description: critical, high, medium, low, not_defined 중 쉼표 구분
      schema:
        type: string
    DefectStatus:
      name: status
      in: query
      description: open, in_progress, postponed, intentional, not_fix, resolved 중 쉼표 구분
      schema:
        type: string
    DefectAssignee:
      name: assignee
      in: query
      description: 담당자 사용자 id 또는 none(미지정), 쉼표 구분
      schema:
        type: string
    DefectFile:
      name: file
      in: query
      description: 파일 경로(최대 1000자). 역슬래시는 / 로, NFC로 바꿔 비교한다
      schema:
        type: string
    DefectFileMode:
      name: file_mode
      in: query
      schema:
        type: string
        enum: [prefix, contains]
        default: prefix
    DefectQ:
      name: q
      in: query
      description: 검색어(최대 200자). 메시지·규칙 키·파일 경로의 부분 일치(대소문자 무시는 ASCII만)
      schema:
        type: string
    DefectAnalysis:
      name: analysis
      in: query
      description: 분석 id(change와 함께, P19). 그 분석의 신규·해결·재오픈 결함만
      schema:
        type: integer
    DefectChange:
      name: change
      in: query
      description: new(그 분석에서 처음 감지) | resolved(그 분석의 자동 resolved) | reopened(그 분석에서 재오픈). analysis와 함께
      schema:
        type: string
        enum: [new, resolved, reopened]
    GroupId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 세션에 묶인 CSRF 토큰(64자리 16진수)
      schema:
        type: string
    AdminTool:
      name: tool
      in: path
      required: true
      schema:
        type: string
        enum: [ruff, eslint]
    AdminToolVersion:
      name: version
      in: path
      required: true
      schema:
        type: string
        example: 0.16.10
    BackupName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^pjguardian-[0-9]{8}-[0-9]{6}-(daily|manual|pre_restore|pre_upgrade)(-[0-9]{1,3})?\.pjgbak$'
      description: 백업 묶음 파일 이름(P27B)
    BackupUploadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: 32자리 16진수(묶음 올리기, P27B)
    StagingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: 32자리 16진수
    DashboardLanguage:
      name: language
      in: query
      required: false
      description: 분석 언어 필터(P21C) — python 또는 javascript(JS/TS). 그 밖의 값·빈 값은 전체. 보이는 프로젝트 안에서만 거른다. 고른 프로젝트의 언어가 다르면 빈 결과
      schema:
        type: string
    DashboardProject:
      name: project_id
      in: query
      required: false
      description: 프로젝트 하나로 좁힘(정수). 없거나 볼 수 없는 프로젝트는 404 project_not_found(없는 것과 같음)
      schema:
        type: integer
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  requestBodies:
    AdminReason:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                description: 사유(선택, 500자, 감사 로그에 남는다)
  responses:
    Dashboard:
      description: '{data:{…구역 값…, as_of(집계 시각, UTC), cached(캐시 적중)}}. 값의 정의는 docs/architecture.md 29절'
      content:
        application/json:
          schema:
            type: object
    AdminTools:
      description: 바뀐 뒤의 도구 목록(GET /api/v1/admin/tools와 같은 형식)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminToolsData'
    AdminToolNotFound:
      description: tool_version_not_found 또는 staging_not_found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BackupError:
      description: |
        백업·복원 오류(P27B, 문구 backup.error.<code>, docs/error_codes.md). 400 형식(bundle_name_invalid, key_passphrase_weak·mismatch, restore_confirm_mismatch 등),
        403 reauth_failed(비밀번호 재입력 실패), 404 bundle_not_found·upload_not_found, 409 backup_busy·restore_in_progress·worker_not_running·bundle_needs_verify·
        backup_last_success_protected·bundle_exists, 413 upload_too_large, 422 묶음 검증 실패(bundle_corrupt·bundle_entry_not_allowed·manifest_*·bundle_hash_mismatch·
        bundle_db_corrupt·restore_schema_newer·key_test_failed·key_import_failed 등), 429 reauth_rate_limited·key_import_rate_limited, 507 backup_disk_*·restore_disk_low
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminConflict:
      description: 상태 충돌·한도(tool_pinned, tool_needs_verification, tool_blocked, tool_invalid, tool_removal_requested, staging_*, package_too_large, too_many_stagings, insufficient_storage, restart_not_supervised, worker_not_running, worker_already_running, start_* 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminTaskRequested:
      description: '관리 작업 요청됨 {data:{task: AdminTask, merged}}. merged=true면 이미 대기·진행 중인 같은 요청으로 합침'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  task: {$ref: '#/components/schemas/AdminTask'}
                  merged: {type: boolean}
    AdminStaging:
      description: '{data: AdminStaging}'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {$ref: '#/components/schemas/AdminStaging'}
    AdminWorker:
      description: '{data:{state, pid, started_at, beat_at, seconds_since_beat, running_analyses, queued_analyses, pending_uploads, max_concurrent, last_recovery, node, stop_request, supervised, start:{configured, available, reason, last}, warning_no_worker}}'
      content:
        application/json:
          schema:
            type: object
    BadRequest:
      description: 입력 값 오류(invalid_input, invalid_login_id, invalid_email, invalid_role 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 로그인 필요(unauthenticated) 또는 무활동 만료(session_expired)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 권한 없음(forbidden), CSRF 토큰 오류(csrf_invalid), 임시 비밀번호 변경 필요(password_change_required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CsrfInvalid:
      description: CSRF 토큰 없음·불일치(csrf_invalid)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LastAdmin:
      description: 마지막 활성 관리자 보호(last_admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 경로 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RunDetailDeleted:
      description: >-
        run_detail_deleted(P21B) — 상세가 삭제된 Run을 과거 Run으로 열려고 함. error.details에 run(요청한 Run)과 latest(최신 Run 번호).
        Run 번호·건수는 Run 목록·히스토리에서 계속 볼 수 있다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProjectNotFound:
      description: project_not_found(없는 프로젝트, 또는 볼 수 없는 프로젝트 — 존재를 숨기며 응답이 같다)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UploadNotFound:
      description: upload_not_found(없음, 다른 사용자의 업로드, 볼 수 없는 프로젝트의 업로드 — 모두 같은 응답)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AnalysisNotFound:
      description: analysis_not_found(없는 분석, 또는 볼 수 없는 프로젝트의 분석 — 존재를 숨기며 응답이 같다)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DefectNotFound:
      description: defect_not_found(없는 결함, 또는 볼 수 없는 프로젝트의 결함 — 존재를 숨기며 응답이 같다)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GroupNotFound:
      description: group_not_found(없는 그룹, 또는 admin도 이 그룹의 관리자도 아님 — 존재를 숨김)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 서버 오류(상세는 서버 로그에만 기록)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
