                $ref: '#/components/schemas/Error'
        '403':
          description: cannot_unset_self
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: group_not_found, member_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/groups/{id}/accounts:
    post:
      summary: 이 그룹에 새 로컬 계정 생성(admin 또는 이 그룹의 관리자). 역할은 user로 고정, 생성과 동시에 구성원
      description: |
        요청의 role·group_id·auth_type은 무시한다. 임시 비밀번호는 응답에 한 번만 담고 로그·감사 로그에는 남기지 않는다.
        감사 로그 user.create에 group_id와 actor_role(admin|group_manager)을 기록한다.
      operationId: createGroupAccount
      tags: [groups]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_id, display_name]
              properties:
                login_id:
                  type: string
                display_name:
                  type: string
                email:
                  type: string
                  nullable: true
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TempPasswordResponse'
        '400':
          description: invalid_login_id, invalid_display_name(없음·100자 초과·제어/양방향 서식 문자), invalid_email(형식·254자 초과), display_name_reserved(다른 사용자의 로그인 ID와 같은 표시 이름, X06)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/GroupNotFound'
        '409':
          description: login_id_taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/search:
    get:
      summary: 구성원 추가용 사용자 검색(admin 또는 어느 그룹이든 관리자). 활성 사용자, 최대 20명
      description: 로그인 ID·표시 이름 부분 일치. 응답에는 로그인 ID와 표시 이름만 담는다(이메일·역할·상태 없음).
      operationId: searchUsers
      tags: [groups]
      parameters:
        - name: q
          in: query
          required: true
          description: 2자 이상
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      properties:
                        login_id:
                          type: string
                        display_name:
                          type: string
        '400':
          description: search_query_too_short
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---- 관리자 시스템 관리(P20A, admin 전용: 그룹 관리자·일반 사용자 403, 비로그인 401). 웹은 bin/에 쓰지 않고 프로세스를 직접 다루지 않는다 ----
  /api/v1/admin/tools:
    get:
      summary: 분석 도구(ruff·ESLint) 설치 버전 목록, 지금 선택될 버전과 이유(검증 실행 없음), 재검증 요청 상태, Node 상태(워커 생존 신호)
      operationId: adminListTools
      tags: [admin]
      responses:
        '200':
          description: '{data:{tools:[{tool, os, selection:{version, reason(pinned|latest|fallback|pinned_unusable|pending|none), newest, pending}, versions:[AdminToolVersion]}], node}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminToolsData'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/tools/{tool}/versions/{version}/block:
    post:
      summary: 차단(선택에서 제외, DB 값만). 고정된 버전은 409 tool_pinned. 감사 tool.block
      operationId: adminBlockTool
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/AdminTool'
        - $ref: '#/components/parameters/AdminToolVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/AdminReason'
      responses:
        '200':
          $ref: '#/components/responses/AdminTools'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminToolNotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
  /api/v1/admin/tools/{tool}/versions/{version}/unblock:
    post:
      summary: 차단 해제(다음 선택 때 다시 검증). 감사 tool.unblock
      operationId: adminUnblockTool
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/AdminTool'
        - $ref: '#/components/parameters/AdminToolVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/AdminReason'
      responses:
        '200':
          $ref: '#/components/responses/AdminTools'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminToolNotFound'
  /api/v1/admin/tools/{tool}/versions/{version}/pin:
    post:
      summary: 고정. 검증을 실행하지 않는다 — 이미 검증된(active, 지문 같음) 버전만, 아니면 409 tool_needs_verification(먼저 재검증 요청). 감사 tool.pin
      operationId: adminPinTool
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/AdminTool'
        - $ref: '#/components/parameters/AdminToolVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/AdminReason'
      responses:
        '200':
          $ref: '#/components/responses/AdminTools'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminToolNotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
  /api/v1/admin/tools/{tool}/unpin:
    post:
      summary: 고정 해제(자동 최신 선택으로). 감사 tool.unpin
      operationId: adminUnpinTool
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/AdminTool'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/AdminReason'
      responses:
        '200':
          $ref: '#/components/responses/AdminTools'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/tools/{tool}/versions/{version}/verify:
    post:
      summary: 재검증 요청(전체 체크섬 + 스모크). 관리 작업 tool_verify로 넣고 워커 자식이 실행한다. 같은 도구·버전의 대기·실행 중 요청이 있으면 합친다(merged). 감사 tool.reverify_request
      operationId: adminVerifyTool
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/AdminTool'
        - $ref: '#/components/parameters/AdminToolVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/AdminReason'
      responses:
        '202':
          $ref: '#/components/responses/AdminTaskRequested'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminToolNotFound'
  /api/v1/admin/tools/{tool}/versions/{version}/removal:
    post:
      summary: 삭제 예정 표시(선택에서 제외, 실제 삭제는 서버 CLI `tools_ctl.php remove`). 고정된 버전은 409. 감사 tool.mark_removal
      operationId: adminMarkToolRemoval
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/AdminTool'
        - $ref: '#/components/parameters/AdminToolVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/AdminReason'
      responses:
        '200':
          $ref: '#/components/responses/AdminTools'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminToolNotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
    delete:
      summary: 삭제 예정 표시 해제. 감사 tool.unmark_removal
      operationId: adminUnmarkToolRemoval
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/AdminTool'
        - $ref: '#/components/parameters/AdminToolVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/AdminReason'
      responses:
        '200':
          $ref: '#/components/responses/AdminTools'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminToolNotFound'
  /api/v1/admin/tool-staging:
    get:
      summary: 도구 설치 패키지 스테이징 목록(폐기 제외, 최근 20개)과 크기 한도·보관 기간
      operationId: adminListStaging
      tags: [admin]
      responses:
        '200':
          description: '{data:{items:[AdminStaging], max_bytes, retention_seconds}}'
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 스테이징 시작. 크기 한도 tools.package_max_size(413 package_too_large), .zip만(400 package_not_zip), 동시 받는 중 2개(429), 디스크 사전 검사(507)
      operationId: adminInitStaging
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool, file_name, total_size]
              properties:
                tool:
                  type: string
                  enum: [ruff, eslint]
                file_name:
                  type: string
                total_size:
                  type: integer
                expected_sha256:
                  type: string
                  description: 배포처가 공개한 SHA-256(선택, 16진수 64자리)
      responses:
        '201':
          $ref: '#/components/responses/AdminStaging'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/AdminConflict'
        '429':
          $ref: '#/components/responses/AdminConflict'
        '507':
          $ref: '#/components/responses/AdminConflict'
  /api/v1/admin/tool-staging/{id}:
    get:
      summary: 스테이징 하나(설치 결과 포함)
      operationId: adminShowStaging
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/StagingId'
      responses:
        '200':
          $ref: '#/components/responses/AdminStaging'
        '404':
          $ref: '#/components/responses/AdminToolNotFound'
    patch:
      summary: 배포처 공개 해시 입력·지우기({expected_sha256}). 다르면 설치 명령을 보여 주지 않는다(CLI도 거부). 감사 tool.package_hash_set
      operationId: adminUpdateStaging
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/StagingId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_sha256:
                  type: string
                  nullable: true
      responses:
        '200':
          $ref: '#/components/responses/AdminStaging'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/AdminToolNotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
    delete:
      summary: 폐기(보관 파일 삭제, 설치 중이면 409). 감사 tool.package_discarded
      operationId: adminDiscardStaging
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/StagingId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/AdminStaging'
        '404':
          $ref: '#/components/responses/AdminToolNotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
  /api/v1/admin/tool-staging/{id}/chunks/{index}:
    put:
      summary: 조각 하나(원시 본문, 헤더 X-Chunk-Sha256). 순서대로 이어 붙인다(이미 받은 조각의 재전송은 건너뜀, 순서를 건너뛰면 409 details.next)
      operationId: adminStagingChunk
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/StagingId'
        - name: index
          in: path
          required: true
          schema:
            type: integer
        - name: X-Chunk-Sha256
          in: header
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: '{data:{index, received_bytes, next, total_chunks}}'
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AdminConflict'
        '422':
          $ref: '#/components/responses/AdminConflict'
  /api/v1/admin/tool-staging/{id}/complete:
    post:
      summary: 모두 받았으면 전체 SHA-256을 계산해 staged로(웹은 압축을 풀지 않는다). 응답의 install_command를 서버에서 실행한다. 감사 tool.package_staged
      operationId: adminCompleteStaging
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/StagingId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/AdminStaging'
        '404':
          $ref: '#/components/responses/AdminToolNotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
  /api/v1/admin/worker:
    get:
      summary: 워커 상태(생존 신호 파일 + 큐, 읽기 전용) — state(running|stopping|stopped|unresponsive), pid, 시작·신호 시각, 실행 중 분석, 대기 수, 정지 요청, 시작 버튼 사용 가능 여부
      operationId: adminWorkerStatus
      tags: [admin]
      responses:
        '200':
          $ref: '#/components/responses/AdminWorker'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/worker/stop:
    post:
      summary: 안전 정지 요청(stop.request 파일 신호. 새 분석을 시작하지 않고 진행 중인 작업을 끝낸 뒤 종료). 실행 중이 아니면 409. 감사 worker.stop_request
      operationId: adminWorkerStop
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/AdminWorker'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/AdminConflict'
  /api/v1/admin/worker/restart:
    post:
      summary: 재시작 요청(같은 신호, kind=restart → 워커가 종료 코드 75로 끝나 서비스 관리자가 다시 띄움). worker.supervised=false면 409 restart_not_supervised. 감사 worker.restart_request
      operationId: adminWorkerRestart
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/AdminWorker'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/AdminConflict'
  /api/v1/admin/worker/start:
    post:
      summary: 사전 등록 작업 시작 — 설정 worker.start_command의 고정 명령을 셸 없이 인자 배열로 실행(요청 값은 쓰지 않음, 제한 시간 worker.start_timeout). 이미 실행 중·시작 처리 중·미설정·proc_open 비활성이면 409. 감사 worker.start_request(성공·종료 코드만)
      operationId: adminWorkerStart
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: '{data:{ok, exit_code, reason, output(첫 줄, 경로·비밀값 가림), requested_at}}'
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/AdminConflict'
  /api/v1/admin/logs:
    get:
      summary: 앱 로그(오늘, 없으면 어제)의 마지막 N줄(기본 worker.log_tail_lines). 끝에서부터 읽고 경로·비밀값을 가린다. 원본 다운로드는 없다
      operationId: adminLogs
      tags: [admin]
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [worker, all]
        - name: lines
          in: query
          schema:
            type: integer
            minimum: 10
            maximum: 2000
      responses:
        '200':
          description: '{data:{file(파일 이름만), scope, lines:[string], requested, truncated_lines}}'
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/checks:
    get:
      summary: 점검(읽기 전용) — 설정(비밀값은 set/unset, 절대 경로·시작 명령은 값 숨김), 환경(check_env와 같은 검사), 디스크(전체 + 구분별 캐시), 정리 작업, 최근 7일 실패 분석
      operationId: adminChecks
      tags: [admin]
      responses:
        '200':
          description: '{data:{config:[...], environment:{items, time_utc, timezone, https, node}, disk:{...}, cleanup:{...}, failures:{days, by_code, recent}}}'
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/checks/disk-scan:
    post:
      summary: 구분별 디스크 사용량 다시 계산 요청(관리 작업 disk_scan, 워커 자식, 중복 합침). 감사 disk.scan_request
      operationId: adminDiskScan
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/AdminTaskRequested'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/cleanup/run:
    post:
      summary: 지금 정리 실행 요청(관리 작업 cleanup_run, 워커 자식, 중복 실행 방지). 감사 cleanup.run_request
      operationId: adminCleanupRun
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/AdminTaskRequested'
        '403':
          $ref: '#/components/responses/Forbidden'
  # ---- Run 보관·상세 삭제(P21B). admin만, 프로젝트 접근 검사가 먼저(보이지 않는 프로젝트 404 → admin 아님 403) ----
  /api/v1/admin/projects/{id}/runs:
    get:
      summary: Run 관리 목록(최신 Run부터) + 상세 보관 요약
      description: |
        summary.kept(상세 있는 Run 수), deleted(삭제된 Run 수), latest(최신 Run 번호), keep(runs.detail_keep, 0이면 자동 보관 꺼짐),
        next_retention(다음 성공 분석 뒤 자동 삭제될 Run, 최대 runs.retention_batch개), kept_runs(상세 있는 Run 번호 — "오래된 Run 모두 선택"용).
      operationId: adminListRuns
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Run 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminRun'
                  page:
                    $ref: '#/components/schemas/PageInfo'
                  summary:
                    type: object
                    properties:
                      kept:
                        type: integer
                      deleted:
                        type: integer
                      latest:
                        type: integer
                        nullable: true
                      keep:
                        type: integer
                      next_retention:
                        type: array
                        items:
                          type: integer
                      kept_runs:
                        type: array
                        items:
                          type: integer
        '400':
          description: invalid_pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /api/v1/admin/projects/{id}/runs/delete-detail:
    post:
      summary: 고른 Run의 상세 삭제(되돌릴 수 없음). 감사 run.detail_delete(reason manual)
      description: |
        한 트랜잭션. 표식(analyses.run_detail_deleted_*)만 남기고 결함·결함 이력·존재 구간·Run 번호·Run 요약은 지우지 않는다(용량은 거의 줄지 않음, VACUUM 자동 실행 없음).
        최신 Run이 들어 있으면 아무것도 바꾸지 않고 409. 이미 삭제된 Run은 건너뛰고 already로 알린다. 화면은 프로젝트 이름을 입력해야 확인할 수 있다.
      operationId: adminDeleteRunDetail
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runs]
              properties:
                runs:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 1
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: array
                        items:
                          type: integer
                      already:
                        type: array
                        items:
                          type: integer
        '400':
          description: invalid_run_set(정수 Run 번호 1~100개가 아님), invalid_json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: project_not_found(보이지 않는 프로젝트), run_not_found(없는 Run — error.details.runs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: run_latest_not_deletable(최신 Run 포함 — error.details.runs, 아무것도 바뀌지 않음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # ---- 규칙 설명(P22, 명세 11장). 로그인한 모든 사용자. 기준은 활성 도구 버전, 결함 수·프로젝트 이름은 볼 수 있는 프로젝트만 ----
  # ---- 내보내기(P23): POST + CSRF만, 파일 응답. 오류는 파일을 만들기 전에 JSON으로 ----
  /api/v1/projects/{id}/defects/export:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: 결함 목록 내보내기(CSV·XLSX) — 목록 API와 같은 조건·정렬·Run, 쪽과 무관하게 결과 전체, 줄임 없는 값
      description: |
        열: 결함 번호, 도구, 규칙, 심각도, 상태, 담당자(표시 이름), 파일, 줄, 메시지, 최근 감지 Run, 최근 감지 일시(KST), 처음 감지 Run.
        XLSX 두 번째 시트 "조건": 내보낸 시각·프로젝트·적용된 조건·정렬·보기 Run·행 수. 감사 export.defects.
      operationId: exportDefects
      tags: [defects]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              additionalProperties: false
              properties:
                format: { type: string, enum: [xlsx, csv] }
                run: { type: string, description: 과거 Run 보기(그 Run 기준 복원 값, Run 열은 N으로 한정) }
                rule: { type: string }
                severity: { type: string }
                status: { type: string }
                assignee: { type: string }
                file: { type: string }
                file_mode: { type: string, enum: [prefix, contains] }
                q: { type: string }
                sort: { type: string, enum: [file, rule, severity, status, run, last_seen] }
                order: { type: string, enum: [asc, desc] }
                analysis: { type: string }
                change: { type: string, enum: [new, resolved, reopened] }
                from_run: { type: string }
                in_run_from: { type: string }
                in_run_to: { type: string }
      responses:
        '200':
          description: 파일(Content-Disposition attachment — filename(ASCII 대체) + filename*=UTF-8''…, Cache-Control no-store, X-Export-Rows = 행 수)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        '400':
          description: invalid_export_format, invalid_defect_filter, invalid_sort(조건 — 목록 API와 같은 검증, 알 수 없는 키 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: project_not_found(보이지 않는 프로젝트 — 없는 것과 같은 404), run_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: run_detail_deleted(삭제된 Run)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: export_empty(내보낼 항목 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: export_too_large(details.count·limit — 파일을 만들지 않음, 잘라서 주지 않음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: export_busy(동시 실행 — details.scope = user | server)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: export_timeout(시간 상한) · export_failed(메모리 상한 등 — 쓰던 임시 파일은 지움)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/my-defects/export:
    post:
      summary: 내게 지정된 결함 내보내기(CSV·XLSX) — 볼 수 있는 프로젝트의 내 결함, 목록과 같은 조건·순서. 첫 열 = 프로젝트
